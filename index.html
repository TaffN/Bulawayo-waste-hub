<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bulawayo Waste Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: civic operations console - top bar, stage-aware nav rail, map canvas with a details panel. Neutrals lean slightly green toward the accent. */
:root {
  --bg: #f4f6f4;
  --surface: #ffffff;
  --surface-2: #eaeeeb;
  --line: #d3dad5;
  --fg: #17211c;
  --muted: #5a6760;
  --accent: #0e6b58;
  --accent-soft: #dcefe9;
  --ward-fill: #e6ede8;
  --road: #b9c4bd;
  --water: #9cc3d4;
  --st-new: #2563b8;
  --st-assigned: #b7791f;
  --st-progress: #7a4bb5;
  --st-fixed: #2f8a3e;
  --st-overdue: #c2362f;
  --font-ui: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #18201c; --surface-2: #1f2924; --line: #2f3b35;
    --fg: #e5ece8; --muted: #9aa8a0; --accent: #4cc3a6; --accent-soft: #173a31;
    --ward-fill: #1d2823; --road: #3d4a43; --water: #2f5868;
    --st-new: #6aa3f0; --st-assigned: #e0a845; --st-progress: #b18be6; --st-fixed: #5cc06c; --st-overdue: #f0675e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #18201c; --surface-2: #1f2924; --line: #2f3b35;
  --fg: #e5ece8; --muted: #9aa8a0; --accent: #4cc3a6; --accent-soft: #173a31;
  --ward-fill: #1d2823; --road: #3d4a43; --water: #2f5868;
  --st-new: #6aa3f0; --st-assigned: #e0a845; --st-progress: #b18be6; --st-fixed: #5cc06c; --st-overdue: #f0675e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px; padding-inline: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand-mark { width: 28px; height: 28px; flex: none; }
.brand h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.demo-tag { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--st-assigned); border: 1px solid currentColor; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.field select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 13px; color: var(--fg); max-width: 210px; }
.btn { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }

.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 60px); }
nav.rail { border-right: 1px solid var(--line); padding-block: 16px; padding-inline: 10px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); }
.rail-label { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); padding: 12px 10px 4px; }
.nav-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 8px 10px; cursor: pointer; font-size: 14px; }
.nav-item:hover:not([disabled]) { background: var(--surface-2); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item[disabled] { color: var(--muted); cursor: default; }
.stage-chip { font-size: 10.5px; font-family: var(--font-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }

main { padding-block: 20px; padding-inline: 20px; min-width: 0; }
.view-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 14px; }
.view-head h2 { margin: 0; font-size: 20px; letter-spacing: -0.01em; text-wrap: balance; }
.view-head p { margin: 2px 0 0; color: var(--muted); max-width: 65ch; }

.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.stat { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 8px; cursor: pointer; font-size: 13px; }
.stat[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.stat b { font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dot.overdue { background: transparent; border: 2.5px solid var(--st-overdue); }

.map-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.map-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; min-width: 0; }
.map-card svg { width: 100%; height: auto; display: block; }
.map-note { font-size: 12px; color: var(--muted); padding: 6px 6px 2px; }
.pin { cursor: pointer; }
.pin:focus-visible { outline: none; }
.pin:focus-visible circle.core, .pin.selected circle.core { stroke: var(--fg); stroke-width: 3; }
.pin.dim { opacity: 0.22; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h3 { margin: 0; font-size: 15px; }
.ref { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.kv { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 6px 10px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; background: var(--surface-2); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; border-left: 2px solid var(--line); padding-left: 12px; font-size: 13px; }
.timeline time { display: block; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: 13px; }
.hint { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 8px 10px; }

.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
th { font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
td.mono { font-family: var(--font-mono); font-size: 12px; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tab { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tab .count { font-family: var(--font-mono); font-size: 11px; opacity: 0.75; margin-left: 4px; }

.settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; align-items: start; }
.settings-grid td { white-space: normal; }
.decision { display: flex; justify-content: space-between; gap: 12px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.decision:last-child { border-bottom: 0; }
.decision p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.pending { color: var(--st-assigned); border: 1px solid currentColor; background: transparent; }
.locked { padding: 28px; text-align: center; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }

/* ---- Stage 2: phone simulators ---- */
.sim-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; align-items: start; }
.phone { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 10px; width: 100%; max-width: 390px; justify-self: center; min-width: 0; }
.phone-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px 16px 0 0; background: var(--accent); color: var(--surface); }
.phone-head b { display: block; font-size: 14px; }
.phone-head span { font-size: 11.5px; opacity: 0.85; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; flex: none; }
.chat { height: 460px; overflow-y: auto; background: var(--surface-2); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.bubble { max-width: 84%; padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; font-size: 13.5px; overflow-wrap: anywhere; }
.bubble.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 2px; }
.bubble.me { align-self: flex-end; background: var(--accent-soft); border-top-right-radius: 2px; }
.bubble .meta { font-size: 10.5px; color: var(--muted); text-align: right; margin-top: 3px; }
.bubble .shot { width: 200px; max-width: 100%; border-radius: 6px; overflow: hidden; display: block; margin-bottom: 4px; }
.bubble .shot svg, .bubble .shot img { display: block; width: 100%; height: auto; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; align-self: flex-start; max-width: 100%; }
.quick button { background: var(--surface); border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; text-align: left; }
.quick button:hover { background: var(--accent-soft); }
.photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 100%; }
.photo-btn { padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); cursor: pointer; font-size: 11px; color: var(--muted); }
.photo-btn svg { display: block; width: 100%; height: auto; }
.photo-btn span { display: block; padding: 3px 4px; }
.composer { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); align-items: center; }
.composer input[type="text"] { flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font: inherit; color: var(--fg); }
.attach { position: relative; overflow: hidden; }
.attach input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.lang-note { font-size: 11.5px; color: var(--st-assigned); padding: 6px 10px 0; }
.ussd-body { padding: 14px 8px 6px; display: flex; flex-direction: column; gap: 10px; }
.ussd-screen { background: #c9d3bf; color: #1e2a1c; font-family: var(--font-mono); font-size: 13px; line-height: 1.4; min-height: 236px; border-radius: 8px; padding: 12px; white-space: pre-wrap; border: 2px solid #8a977f; overflow-wrap: anywhere; }
.ussd-entry { display: flex; gap: 6px; }
.ussd-entry input { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 15px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; color: var(--fg); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.keypad button { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 0; font-size: 16px; font-family: var(--font-mono); cursor: pointer; }
.keypad button:active { background: var(--accent-soft); }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; max-height: 520px; overflow-y: auto; }
.feed li { border-left: 3px solid var(--line); padding-left: 10px; font-size: 13px; }
.feed li.k-merge { border-color: var(--st-progress); }
.feed li.k-route { border-color: var(--st-assigned); }
.feed li.k-new { border-color: var(--st-new); }
.feed li.k-picker { border-color: var(--st-fixed); }
.feed time { display: block; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.detail-photo { width: 100%; max-width: 240px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.detail-photo svg, .detail-photo img { display: block; width: 100%; height: auto; }
.pin.fresh circle.core { stroke: var(--fg); stroke-width: 3; stroke-dasharray: 4 3; }

@media (max-width: 900px) {
  .map-layout { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  nav.rail { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-block: 8px; gap: 4px; }
  .rail-label { display: none; }
  .nav-item { width: auto; white-space: nowrap; flex: none; }
  main { padding-inline: 16px; }
  .field select { max-width: 160px; }
}
@media (prefers-reduced-motion: no-preference) {
  .pin circle.core { transition: r 0.15s ease; }
}
</style>
</head>
<body style="margin:0">

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="var(--accent)"/><path d="M8 11h12l-1.4 10.2a1.5 1.5 0 0 1-1.5 1.3h-6.2a1.5 1.5 0 0 1-1.5-1.3z M11 8.5h6" fill="none" stroke="var(--surface)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>Bulawayo Waste Hub</h1>
    <span class="demo-tag">Demonstration · sample data</span>
  </div>
  <div class="controls">
    <label class="field" for="role-select">Viewing as
      <select id="role-select"></select>
    </label>
    <label class="field" for="ward-select">Ward
      <select id="ward-select"></select>
    </label>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="nav" aria-label="Sections"></nav>
  <main id="view"></main>
</div>

<script>
(() => {
'use strict';

/* ================= Sample data (all invented) ================= */
const HOUR = 3600e3, DAY = 24 * HOUR;

function prng(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

const CATEGORIES = {
  household: 'Household waste',
  rubble: "Builders' rubble",
  garden: 'Garden waste',
  plastics: 'Plastics and recyclables',
  tyres: 'Old tyres',
  hazardous: 'Hazardous (medical or chemical)'
};
const SIZES = { small: 'Small (a few bags)', medium: 'Medium (wheelbarrow)', large: 'Large (truckload)' };
const HAZARDS = { drain: 'Blocking a drain', burning: 'Being burnt', school: 'Near a school', market: 'At a market' };
const STATUS = {
  new: { label: 'New', color: 'var(--st-new)' },
  assigned: { label: 'Assigned', color: 'var(--st-assigned)' },
  in_progress: { label: 'In progress', color: 'var(--st-progress)' },
  fixed: { label: 'Fixed', color: 'var(--st-fixed)' }
};

// Landmarks per ward (schematic coordinates on a 1000 x 640 canvas)
const SPOTS = {
  W1: [
    { near: 'Market stalls by the main road', x: 470, y: 280, hz: 'market' },
    { near: 'Stream crossing, east side', x: 735, y: 395, hz: 'drain' },
    { near: 'Open ground behind the clinic', x: 370, y: 235, hz: null },
    { near: 'Primary school fence', x: 650, y: 215, hz: 'school' },
    { near: 'Bus stop at the shopping centre', x: 430, y: 410, hz: null },
    { near: 'Vacant stand, south-west', x: 220, y: 440, hz: null },
    { near: 'Drain along the ring road', x: 805, y: 250, hz: 'drain' },
    { near: 'Footpath to the stream', x: 655, y: 470, hz: 'drain' }
  ],
  W2: [
    { near: 'Lane behind the shops', x: 430, y: 280, hz: 'market' },
    { near: 'Storm drain, Main Street', x: 610, y: 360, hz: 'drain' },
    { near: 'Corner of the park', x: 300, y: 420, hz: null },
    { near: 'Back of the community hall', x: 690, y: 210, hz: null }
  ]
};

function buildSeed() {
  const now = Date.now();
  const rnd = prng(20261004);
  const pick = arr => arr[Math.floor(rnd() * arr.length)];

  const wards = [
    { id: 'W1', name: 'Cowdray Park', placeholder: false, note: 'High-density suburb; first pilot ward', committee: ['P-BCC', 'P-RA', 'P-CH', 'P-PG', 'P-WT'] },
    { id: 'W2', name: 'Ward B (to be chosen)', placeholder: true, note: 'Placeholder until Taff and Karl choose the second ward', committee: ['P-BCC', 'P-RA2', 'P-CH2'] }
  ];

  const partners = [
    { id: 'P-BCC', name: 'Bulawayo City Council', short: 'BCC', type: 'Council', role: 'Collection, by-laws, chairs ward reviews' },
    { id: 'P-EMA', name: 'Environmental Management Agency', short: 'EMA', type: 'Regulator', role: 'Enforcement on hazardous and repeat dumping' },
    { id: 'P-OP', name: 'Sample Waste Services (Pvt) Ltd', short: 'Operator', type: 'Private operator', role: 'Contracted collection of large loads' },
    { id: 'P-CH', name: 'Sample Community Church, Cowdray Park', short: 'Church', type: 'Church', role: 'Drop-off point, message between clean-up days' },
    { id: 'P-CH2', name: 'Sample Fellowship, Ward B', short: 'Church B', type: 'Church', role: 'Drop-off point, message between clean-up days' },
    { id: 'P-RA', name: "Cowdray Park residents' association (sample)", short: 'Residents', type: "Residents' association", role: 'Verifies fixes, co-chairs ward review' },
    { id: 'P-RA2', name: "Ward B residents' association (sample)", short: 'Residents B', type: "Residents' association", role: 'Verifies fixes, co-chairs ward review' },
    { id: 'P-BIZ', name: 'Sample Recyclers (Pvt) Ltd', short: 'Recycler', type: 'Business', role: 'Buys sorted recyclables, sponsors rewards' },
    { id: 'P-PG', name: "Cowdray Park pickers' group (sample)", short: 'Pickers', type: 'Waste pickers', role: 'Recovers plastics and metal from reported sites' },
    { id: 'P-WT', name: 'Ward volunteer team', short: 'Ward team', type: 'Ward team', role: 'Clears small sites on clean-up days and between' }
  ];

  const routing_rules = [
    { id: 'R1', category: 'household', size: 'small', partner: 'P-WT', hours: 72, note: 'Ward team clears; BCC collects bags' },
    { id: 'R2', category: 'household', size: 'medium', partner: 'P-BCC', hours: 72, note: '' },
    { id: 'R3', category: 'household', size: 'large', partner: 'P-BCC', hours: 48, note: 'Contractor if BCC truck unavailable' },
    { id: 'R4', category: 'rubble', size: 'any', partner: 'P-OP', hours: 120, note: 'Tipper needed' },
    { id: 'R5', category: 'garden', size: 'any', partner: 'P-WT', hours: 96, note: '' },
    { id: 'R6', category: 'plastics', size: 'any', partner: 'P-PG', hours: 72, note: 'Pickers recover; remainder to BCC' },
    { id: 'R7', category: 'tyres', size: 'any', partner: 'P-BCC', hours: 96, note: '' },
    { id: 'R8', category: 'hazardous', size: 'any', partner: 'P-EMA', hours: 24, note: 'EMA leads; BCC removes' },
    { id: 'R9', category: 'any', size: 'any', hazard: 'burning', partner: 'P-EMA', hours: 24, note: 'Burning overrides category' }
  ];

  const indicators = [
    { code: 'B1', section: 'B', name: 'Partners report joint planning before action', unit: '% agree', baseline: null, target: null },
    { code: 'B2', section: 'B', name: 'Residents feel their views count in decisions', unit: '% agree', baseline: null, target: null },
    { code: 'B3', section: 'B', name: 'Effort continues between clean-up days', unit: '% agree', baseline: null, target: null },
    { code: 'C1', section: 'C', name: 'A ward forum exists to raise waste concerns', unit: '% agree', baseline: null, target: null },
    { code: 'C2', section: 'C', name: 'Waste pickers formally recognised', unit: '% agree', baseline: null, target: null },
    { code: 'C3', section: 'C', name: 'Collection schedule available by phone or radio', unit: '% agree', baseline: null, target: null },
    { code: 'D1', section: 'D', name: 'Households sorting waste outside clean-up days', unit: '% monthly', baseline: null, target: null },
    { code: 'D2', section: 'D', name: 'Would keep habits if the campaign stopped', unit: '% agree', baseline: null, target: null },
    { code: 'D3', section: 'D', name: 'Collection happens on a reliable schedule', unit: '% agree', baseline: null, target: null },
    { code: 'E1', section: 'E', name: 'Residents see enforcement against dumping', unit: '% agree', baseline: null, target: null },
    { code: 'OP1', section: 'App', name: 'Median time from report to fix', unit: 'hours', baseline: null, target: null },
    { code: 'OP2', section: 'App', name: 'Reports made between clean-up days', unit: '% of reports', baseline: null, target: null }
  ];

  const spots = SPOTS;

  const plan = [
    // ward, spot, category, size, channel, ageDays, status, extra hazard
    ['W1', 0, 'household', 'large', 'WhatsApp', 1.5, 'assigned', null],
    ['W1', 0, 'household', 'large', 'USSD', 1.1, 'merged', null],
    ['W1', 0, 'plastics', 'medium', 'WhatsApp', 0.7, 'merged', null],
    ['W1', 1, 'household', 'medium', 'WhatsApp', 2.2, 'in_progress', null],
    ['W1', 2, 'rubble', 'large', 'Web', 9, 'assigned', null],
    ['W1', 3, 'household', 'small', 'WhatsApp', 1, 'new', null],
    ['W1', 4, 'plastics', 'medium', 'USSD', 2, 'in_progress', null],
    ['W1', 5, 'garden', 'medium', 'WhatsApp', 12, 'fixed', null],
    ['W1', 6, 'household', 'medium', 'WhatsApp', 5, 'assigned', 'burning'],
    ['W1', 7, 'tyres', 'medium', 'USSD', 3, 'assigned', null],
    ['W1', 1, 'household', 'large', 'WhatsApp', 20, 'fixed', null],
    ['W1', 2, 'hazardous', 'small', 'WhatsApp', 1, 'new', null],
    ['W1', 5, 'household', 'small', 'USSD', 15, 'fixed', null],
    ['W1', 3, 'plastics', 'small', 'Web', 10, 'fixed', null],
    ['W1', 6, 'household', 'large', 'WhatsApp', 25, 'fixed', null],
    ['W1', 4, 'household', 'medium', 'WhatsApp', 0.3, 'new', null],
    ['W2', 0, 'household', 'medium', 'WhatsApp', 2, 'assigned', null],
    ['W2', 1, 'household', 'large', 'USSD', 1.2, 'in_progress', null],
    ['W2', 2, 'garden', 'small', 'WhatsApp', 9, 'fixed', null],
    ['W2', 3, 'rubble', 'medium', 'Web', 2, 'new', null]
  ];

  const reports = [], report_events = [];
  let lastPrimary = null;
  plan.forEach((p, i) => {
    const [ward, si, category, size, channel, age, status, extraHz] = p;
    const spot = spots[ward][si];
    const id = 'BWH-' + String(1041 + i).padStart(5, '0');
    const created = now - age * DAY - Math.floor(rnd() * 6) * HOUR;
    const hazards = [spot.hz, extraHz].filter(Boolean);
    const jitter = () => Math.round((rnd() - 0.5) * 34);
    const r = {
      id, ward, near: spot.near, x: spot.x + jitter(), y: spot.y + jitter(),
      channel, category, size, hazards, created,
      status: status === 'merged' ? 'merged' : status,
      merged_into: status === 'merged' ? lastPrimary : null,
      owner: null, due: null, fixed: null,
      ai_confidence: Math.round(78 + rnd() * 19)
    };
    if (status !== 'merged') lastPrimary = id;
    reports.push(r);
  });
  // Assign owners and events
  reports.forEach(r => {
    const ev = (t, actor, action, note) => report_events.push({ report: r.id, time: t, actor, action, note: note || '' });
    ev(r.created, 'Resident', 'Reported', 'via ' + r.channel);
    ev(r.created + 2 * 60e3, 'AI triage', 'Tagged', CATEGORIES[r.category] + ', ' + r.size + (r.hazards.length ? ', ' + r.hazards.map(h => HAZARDS[h].toLowerCase()).join(', ') : ''));
    if (r.status === 'merged') { ev(r.created + 3 * 60e3, 'AI triage', 'Merged', 'Same site as ' + r.merged_into); return; }
    if (r.status === 'new') return;
    const rule = matchRule(routing_rules, r);
    r.owner = rule.partner;
    r.due = r.created + rule.hours * HOUR;
    ev(r.created + 10 * 60e3, 'Routing', 'Assigned', 'To ' + partners.find(x => x.id === rule.partner).short + ', due within ' + rule.hours + ' h (rule ' + rule.id + ')');
    if (r.status === 'in_progress' || r.status === 'fixed') ev(r.created + 20 * HOUR, partners.find(x => x.id === r.owner).short, 'Started', '');
    if (r.status === 'fixed') {
      r.fixed = Math.min(now - HOUR, r.created + (30 + Math.floor(rnd() * 50)) * HOUR);
      ev(r.fixed, partners.find(x => x.id === r.owner).short, 'Fixed', 'After photo added');
      ev(r.fixed + HOUR, 'Residents', 'Verified', 'Site checked by residents’ association');
    }
  });

  const collection_schedule = [
    { ward: 'W1', day: 'Tuesday', area: 'North of the main road', operator: 'P-BCC', status: 'On schedule' },
    { ward: 'W1', day: 'Thursday', area: 'South of the main road', operator: 'P-BCC', status: 'Missed last week' },
    { ward: 'W1', day: 'Saturday', area: 'Market and shopping centre', operator: 'P-OP', status: 'On schedule' },
    { ward: 'W2', day: 'Wednesday', area: 'Whole ward', operator: 'P-BCC', status: 'On schedule' }
  ];

  const pickers = [];
  for (let i = 1; i <= 7; i++) pickers.push({ id: 'PK-' + String(i).padStart(3, '0'), ward: i <= 5 ? 'W1' : 'W2', phone: 'basic phone (USSD)', materials: pick([['PET plastic'], ['PET plastic', 'cans'], ['scrap metal'], ['cardboard', 'PET plastic']]).join(', '), registered: now - Math.floor(10 + rnd() * 60) * DAY });
  pickers[1].phone = 'smartphone (WhatsApp)';
  pickers[4].phone = 'smartphone (WhatsApp)';

  const recoveries = [];
  for (let i = 0; i < 12; i++) {
    const pk = pickers[Math.floor(rnd() * 5)];
    recoveries.push({ picker: pk.id, material: pk.materials.split(', ')[0], kg: Math.round(8 + rnd() * 45), buyer: 'P-BIZ', date: now - Math.floor(rnd() * 28) * DAY });
  }
  recoveries.sort((a, b) => b.date - a.date);

  const meetings = [
    { id: 'M1', ward: 'W1', date: firstFriday(now, -1) + 2 * HOUR * 7, title: 'Ward review after clean-up day', attended: ['P-BCC', 'P-RA', 'P-CH', 'P-PG'] },
    { id: 'M2', ward: 'W2', date: firstFriday(now, -1) + 2 * HOUR * 8, title: 'Ward review after clean-up day', attended: ['P-BCC', 'P-RA2'] }
  ];
  const actions = [
    { meeting: 'M1', text: 'Daily bin collection at the market stalls', owner: 'P-BCC', due: now + 5 * DAY, status: 'In progress' },
    { meeting: 'M1', text: 'Church to host a Saturday plastics drop-off', owner: 'P-CH', due: now + 9 * DAY, status: 'Not started' },
    { meeting: 'M1', text: 'Evening patrol of the stream crossing', owner: 'P-RA', due: now - 2 * DAY, status: 'Overdue' },
    { meeting: 'M1', text: 'Register five more pickers', owner: 'P-PG', due: now + 14 * DAY, status: 'In progress' },
    { meeting: 'M2', text: 'Confirm second-ward boundary and committee', owner: 'P-BCC', due: now + 7 * DAY, status: 'Not started' }
  ];

  return { version: 1, seededAt: now, wards, partners, routing_rules, indicators, reports, report_events, collection_schedule, pickers, recoveries, meetings, actions };
}

function firstFriday(t, monthOffset) {
  const d = new Date(t); d.setDate(1); d.setMonth(d.getMonth() + monthOffset); d.setHours(0, 0, 0, 0);
  while (d.getDay() !== 5) d.setDate(d.getDate() + 1);
  return d.getTime();
}

function matchRule(rules, r) {
  return rules.find(x => x.hazard && r.hazards.includes(x.hazard))
    || rules.find(x => x.category === r.category && x.size === r.size)
    || rules.find(x => x.category === r.category && x.size === 'any')
    || rules[1];
}

/* ================= Data layer (the "repository") =================
   Screens only call these functions. Later this layer talks to
   PostgreSQL instead of the browser, and survey results load here. */
const STORE_KEY = 'bwh-demo-v1';
const store = (() => {
  let db = null;
  function load() {
    try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const d = JSON.parse(raw); if (d && d.version === 1) return d; } } catch (e) {}
    return buildSeed();
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (e) {} }
  db = load(); save();
  return {
    tables: () => ['wards', 'partners', 'routing_rules', 'indicators', 'reports', 'report_events', 'collection_schedule', 'pickers', 'recoveries', 'meetings', 'actions'],
    all: t => db[t].slice(),
    where: (t, fn) => db[t].filter(fn),
    get: (t, id) => db[t].find(x => x.id === id),
    insert: (t, row) => { db[t].push(row); save(); return row; },
    update: (t, id, patch) => { const r = db[t].find(x => x.id === id); if (r) { Object.assign(r, patch); save(); } return r; },
    reset: () => { db = buildSeed(); save(); }
  };
})();

/* ================= Helpers ================= */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const partnerShort = id => { const p = store.get('partners', id); return p ? p.short : '—'; };
const fmtDate = t => new Date(t).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const fmtDay = t => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
function ago(t) {
  const h = (Date.now() - t) / HOUR;
  if (h < 1) return 'under an hour ago';
  if (h < 24) return Math.round(h) + ' h ago';
  return Math.round(h / 24) + ' days ago';
}
const isOverdue = r => r.due && r.status !== 'fixed' && r.status !== 'merged' && Date.now() > r.due;
const duplicatesOf = r => store.where('reports', x => x.merged_into === r.id);

/* ================= Shared bits ================= */
function wardReports() { return store.where('reports', r => r.ward === state.ward && r.status !== 'merged'); }
function statusOf(r) { return isOverdue(r) ? 'overdue' : r.status; }
function statusPill(r) {
  const st = STATUS[r.status] || { label: 'Merged', color: 'var(--muted)' };
  const over = isOverdue(r) ? `<span class="pill" style="color:var(--st-overdue)"><span class="dot overdue"></span>Overdue</span>` : '';
  return `<span class="pill"><span class="dot" style="background:${st.color}"></span>${st.label}</span> ${over}`;
}
function statsBar(list) {
  const counts = { all: list.length, new: 0, assigned: 0, in_progress: 0, fixed: 0, overdue: 0 };
  list.forEach(r => { counts[r.status]++; if (isOverdue(r)) counts.overdue++; });
  const items = [['all', 'All open and fixed', null], ['new', 'New', STATUS.new.color], ['assigned', 'Assigned', STATUS.assigned.color], ['in_progress', 'In progress', STATUS.in_progress.color], ['fixed', 'Fixed', STATUS.fixed.color], ['overdue', 'Overdue', 'overdue']];
  return `<div class="stats" role="group" aria-label="Filter by status">` + items.map(([k, label, c]) =>
    `<button class="stat" data-filter="${k}" aria-pressed="${state.filter === k}">${c === 'overdue' ? '<span class="dot overdue"></span>' : c ? `<span class="dot" style="background:${c}"></span>` : ''}${label} <b>${counts[k]}</b></button>`
  ).join('') + `</div>`;
}
function passesFilter(r) {
  if (state.filter === 'all') return true;
  if (state.filter === 'overdue') return isOverdue(r);
  return r.status === state.filter;
}
function roleNote() {
  const role = currentRole();
  if (role.partner) return `Cases owned by ${esc(partnerShort(role.partner))} are highlighted; others are faded.`;
  if (role.id === 'resident') return 'Residents see every report and its status, but not who is assigned.';
  return 'The ward committee sees every report, owner and due time.';
}

function pinSvg(r) {
  const role = currentRole();
  const dim = role.partner && r.owner !== role.partner;
  const radius = r.size === 'large' ? 15 : r.size === 'medium' ? 12 : 9;

  return `<g class="pin${dim ? ' dim' : ''}${state.selected === r.id ? ' selected' : ''}${r.live ? ' fresh' : ''}" transform="translate(${r.x},${r.y})" tabindex="0" role="button" data-id="${r.id}" aria-label="${esc(r.id + ', ' + CATEGORIES[r.category] + ', ' + (STATUS[r.status] || {}).label + ', ' + r.near)}">

function summaryPanel(list) {

  const fixHours = fixed.map(r => (r.fixed - r.created) / HOUR).sort((a, b) => a - b);

/* ================= Stage 2: the report pipeline =================
   The same steps the real app will run on a server:
   receive -> AI triage -> duplicate check -> routing by the Charter. */
const feed = [];
function logFeed(kind, text, reportId) { feed.unshift({ time: Date.now(), kind, text, reportId: reportId || null }); }
function nextReportId() {
  const max = Math.max(0, ...store.all('reports').map(r => Number(r.id.slice(4)) || 0));
  return 'BWH-' + String(max + 1).padStart(5, '0');
}
function addEvent(report, actor, action, note, at) { store.insert('report_events', { report, time: at || Date.now(), actor, action, note: note || '' }); }
function submitReport(d) {
  const sp = SPOTS[d.ward][d.spot];
  const now = Date.now();
  const id = nextReportId();
  const jit = () => Math.round((Math.random() - 0.5) * 24);
  const fromSample = d.photo && d.photo !== 'upload';
  const r = {
    id, ward: d.ward, near: sp.near, x: sp.x + jit(), y: sp.y + jit(), channel: d.channel,
    category: d.category, size: d.size, hazards: d.hazards, created: now, status: 'new',
    merged_into: null, owner: null, due: null, fixed: null,
    ai_confidence: fromSample ? 86 + Math.floor(Math.random() * 11) : 70 + Math.floor(Math.random() * 10),
    photo: d.photo || null, live: true
  };
  store.insert('reports', r);
  if (d.photo === 'upload' && d.uploadData) uploads[id] = d.uploadData;
  const wardName = store.get('wards', d.ward).name;
  addEvent(id, 'Resident', 'Reported', 'via ' + d.channel, now);
  logFeed('new', `${id} received by ${d.channel} in ${wardName}.`, id);
  const tagNote = CATEGORIES[r.category] + ', ' + r.size + (r.hazards.length ? ', ' + r.hazards.map(h => HAZARDS[h].toLowerCase()).join(', ') : '');
  addEvent(id, 'AI triage', 'Tagged', tagNote, now + 1000);
  logFeed('new', `AI triage tagged it: ${tagNote} (${r.ai_confidence}% confident).`, id);

  const nearby = store.where('reports', x => x.ward === r.ward && x.id !== id && x.status !== 'merged' && x.status !== 'fixed')
    .map(x => ({ x, dist: Math.hypot(x.x - r.x, x.y - r.y) })).filter(o => o.dist < 70).sort((a, b) => a.dist - b.dist);
  if (nearby.length) {
    const prim = nearby[0].x;
    store.update('reports', id, { status: 'merged', merged_into: prim.id });
    const extra = r.hazards.filter(h => !prim.hazards.includes(h));
    if (extra.length) store.update('reports', prim.id, { hazards: prim.hazards.concat(extra) });
    addEvent(id, 'AI triage', 'Merged', 'Same site as ' + prim.id, now + 2000);
    logFeed('merge', `Same site as open report ${prim.id}, so it was merged there instead of creating a new case${extra.length ? '; the new hazard was added to that case' : ''}.`, prim.id);
    return { report: store.get('reports', id), mergedInto: prim };
  }
  const rule = matchRule(store.all('routing_rules'), r);
  store.update('reports', id, { status: 'assigned', owner: rule.partner, due: now + rule.hours * HOUR });
  addEvent(id, 'Routing', 'Assigned', 'To ' + partnerShort(rule.partner) + ', due within ' + rule.hours + ' h (rule ' + rule.id + ')', now + 3000);
  logFeed('route', `No open report at that spot, so a new case was opened and routed to ${partnerShort(rule.partner)}, due within ${rule.hours} hours (Charter rule ${rule.id}).`, id);
  return { report: store.get('reports', id), rule };
}
function statusText(r) {
  if (!r) return null;
  const target = r.status === 'merged' ? store.get('reports', r.merged_into) : r;
  const st = (STATUS[target.status] || {}).label || target.status;
  return { target, st, overdue: isOverdue(target) };
}

const SIZE_ND = { small: 'Kuncane (small)', medium: 'Kuphakathi (medium)', large: 'Kukhulu (large)' };

let wa;
function waReset() {
  wa = { lang: null, step: 'lang', draft: {}, msgs: [{ from: 'bot', text: 'Welcome to the Bulawayo Waste Hub demo.\nSawubona! Mhoro! Choose a language / Khetha ulimi / Sarudza mutauro:' }], buttons: LANG_BUTTONS.slice() };

function waT() { return T[wa.lang || 'en']; }

}

function waAction(a, label) {
  const t = waT();
  const [k, v] = a.split(':');

  if (k === 'go') {
    waMe(label);
    if (v === 'report') { wa.step = 'photo'; wa.draft = { ward: state.ward, channel: 'WhatsApp' }; waBot(t.photo, [], { photos: true }); }
    if (v === 'check') { wa.step = 'check'; waBot(t.askRef); }
    if (v === 'days') {
      const rows = store.where('collection_schedule', c => c.ward === state.ward);
      waBot(t.days + '\n' + (rows.map(c => `• ${dayL(c.day, wa.lang)}: ${areaL(c.area, wa.lang)}${c.status !== 'On schedule' ? ' (' + schedL(c.status, wa.lang) + ')' : ''}`).join('\n') || '—'), [['menu:', t.again]]);
    }
    return;
  }
  if (k === 'menu') { waMe(label); waMenu(); return; }
  if (k === 'photo') {
    const p = PHOTOS[v];
    wa.draft.photo = v; wa.draft.category = p.category; wa.draft.hazards = p.hazards.slice();
    waMe('', { photo: v });
    wa.step = 'ai';
    waBot(t.ai(catL(p.category, wa.lang) + (p.hazards.length ? ', ' + hzL(p.hazards[0], wa.lang).toLowerCase() : '')), [['ai:yes', t.yes], ['ai:change', t.change]]);
    return;
  }

  if (k === 'type') { waMe(label); wa.draft.category = v; return waAskSize(); }
  if (k === 'size') {
    waMe(label); wa.draft.size = v; wa.step = 'where';

    return;
  }

    const spotHz = SPOTS[wa.draft.ward][wa.draft.spot].hz;

    waBot(t.hazard, [['hz:drain', hzL('drain', wa.lang)], ['hz:burning', hzL('burning', wa.lang)], ['hz:school', hzL('school', wa.lang)], ['hz:none', t.none]]);
    return;

    wa.step = 'confirm';

    return;
  }
  if (k === 'submit') {
    waMe(label);
    if (v === 'no') { waBot(t.cancelled); waMenu(); return; }
    const res = submitReport(wa.draft);
    waBot(t.thanks(res.report.id));
    if (res.mergedInto) waBot(t.merged(res.mergedInto.id));
    else waBot(t.routed(store.get('partners', res.rule.partner).name, res.rule.hours));

    waMenu();
    return;
  }
}
function waAskType() {

function waAskSize() {

function waText(text) {

    if (!info) { waBot(t.notFound, [['menu:', t.again]]); return; }
    let msg = t.status(id, stL(info.target.status, wa.lang) + (info.overdue ? ', ' + stL('overdue', wa.lang) : ''));
    if (info.target.id !== id) msg += '\n' + UT[wa.lang || 'en'].merged(info.target.id);

function ussdShow() {

function ussdSend() {

    case 'menu':
      if (n === 1) { u.draft = { ward: state.ward, channel: 'USSD', hazards: [] }; u.screen = 'r_where'; }

    case 'r_type': { const keys = Object.keys(CATEGORIES); if (n >= 1 && n <= keys.length) { u.draft.category = keys[n - 1]; u.screen = 'r_size'; } break; }
    case 'r_size': if (n >= 1 && n <= 3) { u.draft.size = ['small', 'medium', 'large'][n - 1]; u.screen = 'r_hz'; } break;
    case 'r_hz': if (n >= 1 && n <= 4) { const hz = [null, 'drain', 'burning', 'school', null][n]; if (hz && !u.draft.hazards.includes(hz)) u.draft.hazards.push(hz); u.screen = 'r_confirm'; } break;

    if (t.closest('[data-ussd-dial]')) { ussd.input = USSD_CODE; render(); return; }
    if (t.closest('[data-ussd-end]')) { ussdReset(); render(); return; }
    const sh = t.closest('[data-show]'); if (sh) { state.selected = sh.dataset.show; const r = store.get('reports', sh.dataset.show); if (r) state.ward = r.ward; state.view = 'map'; state.filter = 'all'; render(); window.scrollTo(0, 0); return; }
  });
  v.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'wa-form') { const i = document.getElementById('wa-text'); waText(i.value); render(); const n = document.getElementById('wa-text'); if (n) n.focus(); }
    if (e.target.id === 'ussd-form') { ussd.input = document.getElementById('ussd-input').value; ussdSend(); render(); }
  });
  v.addEventListener('input', e => { if (e.target.id === 'ussd-input') ussd.input = e.target.value; });
  v.addEventListener('change', e => {
    if (e.target.id !== 'wa-file' || !e.target.files || !e.target.files[0]) return;
    const f = e.target.files[0];
    const img = new Image(), reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        // Shrink the photo so the demo stays light
        const scale = Math.min(1, 480 / Math.max(img.width, img.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        waUpload(cv.toDataURL('image/jpeg', 0.8)); render();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  });
}


render();
})();
</script>
</body>
</html>
