<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bulawayo Waste Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: civic operations console - top bar, stage-aware nav rail, map canvas with a details panel. Neutrals lean slightly green toward the accent. */
:root {
  --bg: #f4f6f4;
  --surface: #ffffff;
  --surface-2: #eaeeeb;
  --line: #d3dad5;
  --fg: #17211c;
  --muted: #5a6760;
  --accent: #0e6b58;
  --accent-soft: #dcefe9;
  --ward-fill: #e6ede8;
  --road: #b9c4bd;
  --water: #9cc3d4;
  --st-new: #2563b8;
  --st-assigned: #b7791f;
  --st-progress: #7a4bb5;
  --st-fixed: #2f8a3e;
  --st-overdue: #c2362f;
  --font-ui: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #18201c; --surface-2: #1f2924; --line: #2f3b35;
    --fg: #e5ece8; --muted: #9aa8a0; --accent: #4cc3a6; --accent-soft: #173a31;
    --ward-fill: #1d2823; --road: #3d4a43; --water: #2f5868;
    --st-new: #6aa3f0; --st-assigned: #e0a845; --st-progress: #b18be6; --st-fixed: #5cc06c; --st-overdue: #f0675e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #18201c; --surface-2: #1f2924; --line: #2f3b35;
  --fg: #e5ece8; --muted: #9aa8a0; --accent: #4cc3a6; --accent-soft: #173a31;
  --ward-fill: #1d2823; --road: #3d4a43; --water: #2f5868;
  --st-new: #6aa3f0; --st-assigned: #e0a845; --st-progress: #b18be6; --st-fixed: #5cc06c; --st-overdue: #f0675e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px; padding-inline: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand-mark { width: 28px; height: 28px; flex: none; }
.brand h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.demo-tag { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--st-assigned); border: 1px solid currentColor; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.field select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 13px; color: var(--fg); max-width: 210px; }
.btn { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }

.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 60px); }
nav.rail { border-right: 1px solid var(--line); padding-block: 16px; padding-inline: 10px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); }
.rail-label { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); padding: 12px 10px 4px; }
.nav-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 8px 10px; cursor: pointer; font-size: 14px; }
.nav-item:hover:not([disabled]) { background: var(--surface-2); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item[disabled] { color: var(--muted); cursor: default; }
.stage-chip { font-size: 10.5px; font-family: var(--font-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }

main { padding-block: 20px; padding-inline: 20px; min-width: 0; }
.view-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 14px; }
.view-head h2 { margin: 0; font-size: 20px; letter-spacing: -0.01em; text-wrap: balance; }
.view-head p { margin: 2px 0 0; color: var(--muted); max-width: 65ch; }

.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.stat { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 8px; cursor: pointer; font-size: 13px; }
.stat[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.stat b { font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dot.overdue { background: transparent; border: 2.5px solid var(--st-overdue); }

.map-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.map-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; min-width: 0; }
.map-card svg { width: 100%; height: auto; display: block; }
.map-note { font-size: 12px; color: var(--muted); padding: 6px 6px 2px; }
.pin { cursor: pointer; }
.pin:focus-visible { outline: none; }
.pin:focus-visible circle.core, .pin.selected circle.core { stroke: var(--fg); stroke-width: 3; }
.pin.dim { opacity: 0.22; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h3 { margin: 0; font-size: 15px; }
.ref { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.kv { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 6px 10px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; background: var(--surface-2); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; border-left: 2px solid var(--line); padding-left: 12px; font-size: 13px; }
.timeline time { display: block; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: 13px; }
.hint { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 8px 10px; }

.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
th { font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
td.mono { font-family: var(--font-mono); font-size: 12px; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tab { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tab .count { font-family: var(--font-mono); font-size: 11px; opacity: 0.75; margin-left: 4px; }

.settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; align-items: start; }
.settings-grid td { white-space: normal; }
.decision { display: flex; justify-content: space-between; gap: 12px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.decision:last-child { border-bottom: 0; }
.decision p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.pending { color: var(--st-assigned); border: 1px solid currentColor; background: transparent; }
.locked { padding: 28px; text-align: center; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }

/* ---- Stage 2: phone simulators ---- */
.sim-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; align-items: start; }
.phone { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 10px; width: 100%; max-width: 390px; justify-self: center; min-width: 0; }
.phone-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px 16px 0 0; background: var(--accent); color: var(--surface); }
.phone-head b { display: block; font-size: 14px; }
.phone-head span { font-size: 11.5px; opacity: 0.85; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; flex: none; }
.chat { height: 460px; overflow-y: auto; background: var(--surface-2); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.bubble { max-width: 84%; padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; font-size: 13.5px; overflow-wrap: anywhere; }
.bubble.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 2px; }
.bubble.me { align-self: flex-end; background: var(--accent-soft); border-top-right-radius: 2px; }
.bubble .meta { font-size: 10.5px; color: var(--muted); text-align: right; margin-top: 3px; }
.bubble .shot { width: 200px; max-width: 100%; border-radius: 6px; overflow: hidden; display: block; margin-bottom: 4px; }
.bubble .shot svg, .bubble .shot img { display: block; width: 100%; height: auto; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; align-self: flex-start; max-width: 100%; }
.quick button { background: var(--surface); border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; text-align: left; }
.quick button:hover { background: var(--accent-soft); }
.photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 100%; }
.photo-btn { padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); cursor: pointer; font-size: 11px; color: var(--muted); }
.photo-btn svg { display: block; width: 100%; height: auto; }
.photo-btn span { display: block; padding: 3px 4px; }
.composer { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); align-items: center; }
.composer input[type="text"] { flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font: inherit; color: var(--fg); }
.attach { position: relative; overflow: hidden; }
.attach input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.lang-note { font-size: 11.5px; color: var(--st-assigned); padding: 6px 10px 0; }
.ussd-body { padding: 14px 8px 6px; display: flex; flex-direction: column; gap: 10px; }
.ussd-screen { background: #c9d3bf; color: #1e2a1c; font-family: var(--font-mono); font-size: 13px; line-height: 1.4; min-height: 236px; border-radius: 8px; padding: 12px; white-space: pre-wrap; border: 2px solid #8a977f; overflow-wrap: anywhere; }
.ussd-entry { display: flex; gap: 6px; }
.ussd-entry input { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 15px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; color: var(--fg); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.keypad button { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 0; font-size: 16px; font-family: var(--font-mono); cursor: pointer; }
.keypad button:active { background: var(--accent-soft); }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; max-height: 520px; overflow-y: auto; }
.feed li { border-left: 3px solid var(--line); padding-left: 10px; font-size: 13px; }
.feed li.k-merge { border-color: var(--st-progress); }
.feed li.k-route { border-color: var(--st-assigned); }
.feed li.k-new { border-color: var(--st-new); }
.feed li.k-picker, .feed li.k-fixed { border-color: var(--st-fixed); }
.feed time { display: block; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.detail-photo { width: 100%; max-width: 240px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.detail-photo svg, .detail-photo img { display: block; width: 100%; height: auto; }
.pin.fresh circle.core { stroke: var(--fg); stroke-width: 3; stroke-dasharray: 4 3; }

/* ---- Stage 3: partner queues ---- */
.queue { display: flex; flex-direction: column; gap: 10px; }
.case { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: var(--radius); padding: 12px; }
.case.st-assigned { border-left-color: var(--st-assigned); }
.case.st-in_progress { border-left-color: var(--st-progress); }
.case.st-new { border-left-color: var(--st-new); }
.case.st-fixed { border-left-color: var(--st-fixed); }
.case.is-overdue { border-left-color: var(--st-overdue); }
.case-photo { border-radius: 6px; overflow: hidden; border: 1px solid var(--line); align-self: start; }
.case-photo svg, .case-photo img { display: block; width: 100%; height: auto; }
.case-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.case-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; }
.case-top b { font-size: 14.5px; }
.due { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.due.late { color: var(--st-overdue); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 2px; }
.subform { display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); border-radius: 6px; padding: 10px; }
.subform select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; color: var(--fg); font: inherit; }
.after-choice { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.after-choice .photo-btn { width: 110px; }
.after-choice .photo-btn[aria-pressed="true"] { outline: 2px solid var(--accent); }
.flash { background: var(--accent-soft); color: var(--fg); border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; font-size: 13.5px; }
.before-after { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-width: 320px; }
.before-after figure { margin: 0; }
.before-after figcaption { font-size: 11px; color: var(--muted); }
.before-after .detail-photo { max-width: none; }
.sms { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; }
.sms b { display: block; font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
details.recent summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 4px 0; }
@media (max-width: 480px) { .case { grid-template-columns: 72px minmax(0, 1fr); } }

/* ---- Stage 4: pickers and recyclables ---- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.kpi b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; align-items: start; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
.form-grid select, .form-grid input { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; color: var(--fg); font: inherit; min-width: 0; }
.mini-bar { height: 8px; border-radius: 4px; background: var(--accent); }
.mini-track { background: var(--surface-2); border-radius: 4px; width: 100%; min-width: 80px; }
.pstatus { font-size: 12px; font-weight: 600; }
.pstatus.wait { color: var(--st-assigned); }
.pstatus.ok { color: var(--st-fixed); }
.pstatus.disputed { color: var(--st-overdue); }

/* ---- Stage 5: review pack and forum ---- */
.summary { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
.summary p { margin: 6px 0 0; max-width: 75ch; }
.summary .ref { letter-spacing: 0.06em; text-transform: uppercase; }
.astat { font-size: 12px; font-weight: 600; white-space: nowrap; }
.astat.done { color: var(--st-fixed); }
.astat.late { color: var(--st-overdue); }
.astat.prog { color: var(--st-progress); }
.astat.todo { color: var(--muted); }
td select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; color: var(--fg); font: inherit; font-size: 12.5px; }
.add-action { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.add-action label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
.add-action input, .add-action select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; color: var(--fg); font: inherit; min-width: 0; }
@media (max-width: 640px) { .add-action { grid-template-columns: minmax(0, 1fr); } }
.section-gap { display: flex; flex-direction: column; gap: 16px; }

/* ---- Stage 6: demo guide and feedback ---- */
.hero-intro { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; display: grid; gap: 8px; }
.hero-intro h2 { margin: 0; font-size: 22px; letter-spacing: -0.01em; text-wrap: balance; }
.hero-intro p { margin: 0; color: var(--muted); max-width: 70ch; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; counter-reset: step; }
.step { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; counter-increment: step; }
.step::before { content: counter(step); width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.step h3 { margin: 0 0 2px; font-size: 14.5px; }
.step p { margin: 0; font-size: 13.5px; }
.step .why { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.step .as { font-size: 11.5px; font-family: var(--font-mono); color: var(--muted); }
@media (max-width: 560px) { .step { grid-template-columns: 30px minmax(0, 1fr); } .step > .btn { grid-column: 2; justify-self: start; } }
.rating { display: flex; flex-wrap: wrap; gap: 6px; }
.rating label { display: inline-flex; }
.rating input { position: absolute; opacity: 0; pointer-events: none; }
.rating span { min-width: 38px; text-align: center; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; cursor: pointer; background: var(--surface-2); font-variant-numeric: tabular-nums; }
.rating input:checked + span { background: var(--accent); color: var(--surface); border-color: var(--accent); font-weight: 700; }
.rating input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.fq { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.fq:last-child { border-bottom: 0; }
.fq > b { font-size: 13.5px; }
.fq small { color: var(--muted); }
textarea.fb { width: 100%; min-height: 72px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: var(--fg); font: inherit; resize: vertical; }
a.btn { color: var(--fg); text-decoration: none; display: inline-flex; align-items: center; }
.copybox { width: 100%; min-height: 120px; font-family: var(--font-mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px; color: var(--fg); }

@media (max-width: 900px) {
  .map-layout { grid-template-columns: minmax(0, 1fr); }
}

  nav.rail { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-block: 8px; gap: 4px; }
  .rail-label { display: none; }

<body style="margin:0">

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="var(--accent)"/><path d="M8 11h12l-1.4 10.2a1.5 1.5 0 0 1-1.5 1.3h-6.2a1.5 1.5 0 0 1-1.5-1.3z M11 8.5h6" fill="none" stroke="var(--surface)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>Bulawayo Waste Hub</h1>
    <span class="demo-tag">Demonstration · sample data</span>
  </div>
  <div class="controls">
    <label class="field" for="role-select">Viewing as
      <select id="role-select"></select>
    </label>
    <label class="field" for="ward-select">Ward
      <select id="ward-select"></select>
    </label>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="nav" aria-label="Sections"></nav>
  <main id="view"></main>
</div>

<script>
(() => {
'use strict';

/* ================= Sample data (all invented) ================= */
const HOUR = 3600e3, DAY = 24 * HOUR;

function prng(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

const CATEGORIES = {
  household: 'Household waste',
  rubble: "Builders' rubble",
  garden: 'Garden waste',
  plastics: 'Plastics and recyclables',
  tyres: 'Old tyres',
  hazardous: 'Hazardous (medical or chemical)'
};
const SIZES = { small: 'Small (a few bags)', medium: 'Medium (wheelbarrow)', large: 'Large (truckload)' };
const HAZARDS = { drain: 'Blocking a drain', burning: 'Being burnt', school: 'Near a school', market: 'At a market' };
const STATUS = {
  new: { label: 'New', color: 'var(--st-new)' },
  assigned: { label: 'Assigned', color: 'var(--st-assigned)' },
  in_progress: { label: 'In progress', color: 'var(--st-progress)' },
  fixed: { label: 'Fixed', color: 'var(--st-fixed)' }
};

// Landmarks per ward (schematic coordinates on a 1000 x 640 canvas)
const SPOTS = {
  W1: [
    { near: 'Market stalls by the main road', x: 470, y: 280, hz: 'market' },
    { near: 'Stream crossing, east side', x: 735, y: 395, hz: 'drain' },
    { near: 'Open ground behind the clinic', x: 370, y: 235, hz: null },
    { near: 'Primary school fence', x: 650, y: 215, hz: 'school' },
    { near: 'Bus stop at the shopping centre', x: 430, y: 410, hz: null },
    { near: 'Vacant stand, south-west', x: 220, y: 440, hz: null },
    { near: 'Drain along the ring road', x: 805, y: 250, hz: 'drain' },
    { near: 'Footpath to the stream', x: 655, y: 470, hz: 'drain' }
  ],
  W2: [
    { near: 'Lane behind the shops', x: 430, y: 280, hz: 'market' },
    { near: 'Storm drain, Main Street', x: 610, y: 360, hz: 'drain' },
    { near: 'Corner of the park', x: 300, y: 420, hz: null },
    { near: 'Back of the community hall', x: 690, y: 210, hz: null }
  ]
};

function buildSeed() {
  const now = Date.now();
  const rnd = prng(20261004);
  const pick = arr => arr[Math.floor(rnd() * arr.length)];

  const wards = [
    { id: 'W1', name: 'Cowdray Park', placeholder: false, note: 'High-density suburb; first pilot ward', committee: ['P-BCC', 'P-RA', 'P-CH', 'P-PG', 'P-WT'] },
    { id: 'W2', name: 'Ward B (to be chosen)', placeholder: true, note: 'Placeholder until Taff and Karl choose the second ward', committee: ['P-BCC', 'P-RA2', 'P-CH2'] }
  ];

  const partners = [
    { id: 'P-BCC', name: 'Bulawayo City Council', short: 'BCC', type: 'Council', role: 'Collection, by-laws, chairs ward reviews' },
    { id: 'P-EMA', name: 'Environmental Management Agency', short: 'EMA', type: 'Regulator', role: 'Enforcement on hazardous and repeat dumping' },
    { id: 'P-OP', name: 'Sample Waste Services (Pvt) Ltd', short: 'Operator', type: 'Private operator', role: 'Contracted collection of large loads' },
    { id: 'P-CH', name: 'Sample Community Church, Cowdray Park', short: 'Church', type: 'Church', role: 'Drop-off point, message between clean-up days' },
    { id: 'P-CH2', name: 'Sample Fellowship, Ward B', short: 'Church B', type: 'Church', role: 'Drop-off point, message between clean-up days' },
    { id: 'P-RA', name: "Cowdray Park residents' association (sample)", short: 'Residents', type: "Residents' association", role: 'Verifies fixes, co-chairs ward review' },
    { id: 'P-RA2', name: "Ward B residents' association (sample)", short: 'Residents B', type: "Residents' association", role: 'Verifies fixes, co-chairs ward review' },
    { id: 'P-BIZ', name: 'Sample Recyclers (Pvt) Ltd', short: 'Recycler', type: 'Business', role: 'Buys sorted recyclables, sponsors rewards' },
    { id: 'P-PG', name: "Cowdray Park pickers' group (sample)", short: 'Pickers', type: 'Waste pickers', role: 'Recovers plastics and metal from reported sites' },
    { id: 'P-WT', name: 'Ward volunteer team', short: 'Ward team', type: 'Ward team', role: 'Clears small sites on clean-up days and between' }
  ];

  const routing_rules = [
    { id: 'R1', category: 'household', size: 'small', partner: 'P-WT', hours: 72, note: 'Ward team clears; BCC collects bags' },
    { id: 'R2', category: 'household', size: 'medium', partner: 'P-BCC', hours: 72, note: '' },
    { id: 'R3', category: 'household', size: 'large', partner: 'P-BCC', hours: 48, note: 'Contractor if BCC truck unavailable' },
    { id: 'R4', category: 'rubble', size: 'any', partner: 'P-OP', hours: 120, note: 'Tipper needed' },
    { id: 'R5', category: 'garden', size: 'any', partner: 'P-WT', hours: 96, note: '' },
    { id: 'R6', category: 'plastics', size: 'any', partner: 'P-PG', hours: 72, note: 'Pickers recover; remainder to BCC' },
    { id: 'R7', category: 'tyres', size: 'any', partner: 'P-BCC', hours: 96, note: '' },
    { id: 'R8', category: 'hazardous', size: 'any', partner: 'P-EMA', hours: 24, note: 'EMA leads; BCC removes' },
    { id: 'R9', category: 'any', size: 'any', hazard: 'burning', partner: 'P-EMA', hours: 24, note: 'Burning overrides category' }
  ];

  const indicators = [
    { code: 'B1', section: 'B', name: 'Partners report joint planning before action', unit: '% agree', baseline: null, target: null },
    { code: 'B2', section: 'B', name: 'Residents feel their views count in decisions', unit: '% agree', baseline: null, target: null },
    { code: 'B3', section: 'B', name: 'Effort continues between clean-up days', unit: '% agree', baseline: null, target: null },
    { code: 'C1', section: 'C', name: 'A ward forum exists to raise waste concerns', unit: '% agree', baseline: null, target: null },
    { code: 'C2', section: 'C', name: 'Waste pickers formally recognised', unit: '% agree', baseline: null, target: null },
    { code: 'C3', section: 'C', name: 'Collection schedule available by phone or radio', unit: '% agree', baseline: null, target: null },
    { code: 'D1', section: 'D', name: 'Households sorting waste outside clean-up days', unit: '% monthly', baseline: null, target: null },
    { code: 'D2', section: 'D', name: 'Would keep habits if the campaign stopped', unit: '% agree', baseline: null, target: null },
    { code: 'D3', section: 'D', name: 'Collection happens on a reliable schedule', unit: '% agree', baseline: null, target: null },
    { code: 'E1', section: 'E', name: 'Residents see enforcement against dumping', unit: '% agree', baseline: null, target: null },
    { code: 'OP1', section: 'App', name: 'Median time from report to fix', unit: 'hours', baseline: null, target: null },
    { code: 'OP2', section: 'App', name: 'Reports made between clean-up days', unit: '% of reports', baseline: null, target: null }
  ];

  const spots = SPOTS;

  const plan = [
    // ward, spot, category, size, channel, ageDays, status, extra hazard
    ['W1', 0, 'household', 'large', 'WhatsApp', 1.5, 'assigned', null],
    ['W1', 0, 'household', 'large', 'USSD', 1.1, 'merged', null],
    ['W1', 0, 'plastics', 'medium', 'WhatsApp', 0.7, 'merged', null],
    ['W1', 1, 'household', 'medium', 'WhatsApp', 2.2, 'in_progress', null],
    ['W1', 2, 'rubble', 'large', 'Web', 9, 'assigned', null],
    ['W1', 3, 'household', 'small', 'WhatsApp', 1, 'new', null],
    ['W1', 4, 'plastics', 'medium', 'USSD', 2, 'in_progress', null],
    ['W1', 5, 'garden', 'medium', 'WhatsApp', 12, 'fixed', null],
    ['W1', 6, 'household', 'medium', 'WhatsApp', 5, 'assigned', 'burning'],
    ['W1', 7, 'tyres', 'medium', 'USSD', 3, 'assigned', null],
    ['W1', 1, 'household', 'large', 'WhatsApp', 20, 'fixed', null],
    ['W1', 2, 'hazardous', 'small', 'WhatsApp', 1, 'new', null],
    ['W1', 5, 'household', 'small', 'USSD', 15, 'fixed', null],
    ['W1', 3, 'plastics', 'small', 'Web', 10, 'fixed', null],
    ['W1', 6, 'household', 'large', 'WhatsApp', 25, 'fixed', null],
    ['W1', 4, 'household', 'medium', 'WhatsApp', 0.3, 'new', null],
    ['W2', 0, 'household', 'medium', 'WhatsApp', 2, 'assigned', null],
    ['W2', 1, 'household', 'large', 'USSD', 1.2, 'in_progress', null],
    ['W2', 2, 'garden', 'small', 'WhatsApp', 9, 'fixed', null],
    ['W2', 3, 'rubble', 'medium', 'Web', 2, 'new', null]
  ];

  const reports = [], report_events = [];
  let lastPrimary = null;
  plan.forEach((p, i) => {
    const [ward, si, category, size, channel, age, status, extraHz] = p;
    const spot = spots[ward][si];
    const id = 'BWH-' + String(1041 + i).padStart(5, '0');
    const created = now - age * DAY - Math.floor(rnd() * 6) * HOUR;
    const hazards = [spot.hz, extraHz].filter(Boolean);
    const jitter = () => Math.round((rnd() - 0.5) * 34);
    const r = {
      id, ward, near: spot.near, x: spot.x + jitter(), y: spot.y + jitter(),
      channel, category, size, hazards, created,
      status: status === 'merged' ? 'merged' : status,
      merged_into: status === 'merged' ? lastPrimary : null,
      owner: null, due: null, fixed: null,
      ai_confidence: Math.round(78 + rnd() * 19)
    };
    if (status !== 'merged') lastPrimary = id;
    reports.push(r);
  });
  // Assign owners and events
  reports.forEach(r => {
    const ev = (t, actor, action, note) => report_events.push({ report: r.id, time: t, actor, action, note: note || '' });
    ev(r.created, 'Resident', 'Reported', 'via ' + r.channel);
    ev(r.created + 2 * 60e3, 'AI triage', 'Tagged', CATEGORIES[r.category] + ', ' + r.size + (r.hazards.length ? ', ' + r.hazards.map(h => HAZARDS[h].toLowerCase()).join(', ') : ''));
    if (r.status === 'merged') { ev(r.created + 3 * 60e3, 'AI triage', 'Merged', 'Same site as ' + r.merged_into); return; }
    if (r.status === 'new') return;
    const rule = matchRule(routing_rules, r);
    r.owner = rule.partner;
    r.due = r.created + rule.hours * HOUR;
    ev(r.created + 10 * 60e3, 'Routing', 'Assigned', 'To ' + partners.find(x => x.id === rule.partner).short + ', due within ' + rule.hours + ' h (rule ' + rule.id + ')');
    if (r.status === 'in_progress' || r.status === 'fixed') ev(r.created + 20 * HOUR, partners.find(x => x.id === r.owner).short, 'Started', '');
    if (r.status === 'fixed') {
      r.fixed = Math.min(now - HOUR, r.created + (30 + Math.floor(rnd() * 50)) * HOUR);
      ev(r.fixed, partners.find(x => x.id === r.owner).short, 'Fixed', 'After photo added');
      ev(r.fixed + HOUR, 'Residents', 'Verified', 'Site checked by residents’ association');
    }
  });

  const collection_schedule = [
    { ward: 'W1', day: 'Tuesday', area: 'North of the main road', operator: 'P-BCC', status: 'On schedule' },
    { ward: 'W1', day: 'Thursday', area: 'South of the main road', operator: 'P-BCC', status: 'Missed last week' },
    { ward: 'W1', day: 'Saturday', area: 'Market and shopping centre', operator: 'P-OP', status: 'On schedule' },
    { ward: 'W2', day: 'Wednesday', area: 'Whole ward', operator: 'P-BCC', status: 'On schedule' }
  ];

  const pickers = [];
  for (let i = 1; i <= 7; i++) pickers.push({ id: 'PK-' + String(i).padStart(3, '0'), ward: i <= 5 ? 'W1' : 'W2', phone: 'basic phone (USSD)', materials: pick([['PET plastic'], ['PET plastic', 'cans'], ['scrap metal'], ['cardboard', 'PET plastic']]).join(', '), registered: now - Math.floor(10 + rnd() * 60) * DAY });
  pickers[1].phone = 'smartphone (WhatsApp)';
  pickers[4].phone = 'smartphone (WhatsApp)';

  const recoveries = [];
  for (let i = 0; i < 12; i++) {
    const pk = pickers[Math.floor(rnd() * 5)];
    recoveries.push({ id: 'RC-S' + String(i + 1).padStart(3, '0'), picker: pk.id, material: pk.materials.split(', ')[0], kg: Math.round(8 + rnd() * 45), buyer: 'P-BIZ', date: now - Math.floor(rnd() * 28) * DAY });
  }
  recoveries.sort((a, b) => b.date - a.date);

  const meetings = [
    { id: 'M1', ward: 'W1', date: firstFriday(now, -1) + 2 * HOUR * 7, title: 'Ward review after clean-up day', attended: ['P-BCC', 'P-RA', 'P-CH', 'P-PG'] },
    { id: 'M2', ward: 'W2', date: firstFriday(now, -1) + 2 * HOUR * 8, title: 'Ward review after clean-up day', attended: ['P-BCC', 'P-RA2'] }
  ];
  const actions = [
    { id: 'A-001', meeting: 'M1', text: 'Daily bin collection at the market stalls', owner: 'P-BCC', due: now + 5 * DAY, status: 'In progress' },
    { id: 'A-002', meeting: 'M1', text: 'Church to host a Saturday plastics drop-off', owner: 'P-CH', due: now + 9 * DAY, status: 'Not started' },
    { id: 'A-003', meeting: 'M1', text: 'Evening patrol of the stream crossing', owner: 'P-RA', due: now - 2 * DAY, status: 'Overdue' },
    { id: 'A-004', meeting: 'M1', text: 'Register five more pickers', owner: 'P-PG', due: now + 14 * DAY, status: 'In progress' },
    { id: 'A-005', meeting: 'M2', text: 'Confirm second-ward boundary and committee', owner: 'P-BCC', due: now + 7 * DAY, status: 'Not started' }
  ];

  return { version: 1, seededAt: now, wards, partners, routing_rules, indicators, reports, report_events, collection_schedule, pickers, recoveries, meetings, actions };
}

function firstFriday(t, monthOffset) {
  const d = new Date(t); d.setDate(1); d.setMonth(d.getMonth() + monthOffset); d.setHours(0, 0, 0, 0);
  while (d.getDay() !== 5) d.setDate(d.getDate() + 1);
  return d.getTime();
}

function matchRule(rules, r) {
  return rules.find(x => x.hazard && r.hazards.includes(x.hazard))
    || rules.find(x => x.category === r.category && x.size === r.size)
    || rules.find(x => x.category === r.category && x.size === 'any')
    || rules[1];
}

/* ================= Data layer (the "repository") =================
   Screens only call these functions. Later this layer talks to
   PostgreSQL instead of the browser, and survey results load here. */
const STORE_KEY = 'bwh-demo-v1';
const store = (() => {
  let db = null;
  function load() {
    try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const d = JSON.parse(raw); if (d && d.version === 1) return d; } } catch (e) {}
    return buildSeed();
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (e) {} }
  db = load(); save();
  return {
    tables: () => ['wards', 'partners', 'routing_rules', 'indicators', 'reports', 'report_events', 'collection_schedule', 'pickers', 'recoveries', 'meetings', 'actions'],
    all: t => db[t].slice(),
    where: (t, fn) => db[t].filter(fn),
    get: (t, id) => db[t].find(x => x.id === id),
    insert: (t, row) => { db[t].push(row); save(); return row; },
    update: (t, id, patch) => { const r = db[t].find(x => x.id === id); if (r) { Object.assign(r, patch); save(); } return r; },
    reset: () => { db = buildSeed(); save(); }
  };
})();

/* ================= Helpers ================= */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const partnerShort = id => { const p = store.get('partners', id); return p ? p.short : '—'; };
const fmtDate = t => new Date(t).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const fmtDay = t => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
function ago(t) {
  const h = (Date.now() - t) / HOUR;
  if (h < 1) return 'under an hour ago';
  if (h < 24) return Math.round(h) + ' h ago';
  return Math.round(h / 24) + ' days ago';
}
const isOverdue = r => r.due && r.status !== 'fixed' && r.status !== 'merged' && Date.now() > r.due;
const duplicatesOf = r => store.where('reports', x => x.merged_into === r.id);

/* ================= State ================= */
const ROLES = [
  { id: 'committee', label: 'Ward committee', partner: null },
  { id: 'resident', label: 'Resident', partner: null },
  { id: 'bcc', label: 'City Council (BCC)', partner: 'P-BCC' },
  { id: 'ema', label: 'EMA', partner: 'P-EMA' },
  { id: 'operator', label: 'Private operator', partner: 'P-OP' },
  { id: 'church', label: 'Church', partner: 'P-CH' },
  { id: 'association', label: "Residents' association", partner: 'P-RA' },
  { id: 'business', label: 'Business buyer', partner: 'P-BIZ' },
  { id: 'picker', label: 'Waste picker', partner: 'P-PG' },
  { id: 'ward-team', label: 'Ward volunteer team', partner: 'P-WT' },
  { id: 'admin', label: 'Administrator', partner: null }
];
const VIEWS = [
  { id: 'guide', label: 'Start here', stage: 6 },
  { id: 'map', label: 'Ward map', stage: 1 },
  { id: 'reports', label: 'Reports', stage: 1 },
  { id: 'chat', label: 'WhatsApp and USSD', stage: 2 },
  { id: 'queue', label: 'Partner queues', stage: 3 },
  { id: 'pickers', label: 'Pickers and recyclables', stage: 4 },
  { id: 'review', label: 'Review and forum', stage: 5 },
  { id: 'feedback', label: 'Feedback', stage: 6 },
  { id: 'tables', label: 'Data tables', stage: 1, admin: true },
  { id: 'settings', label: 'Settings', stage: 1, admin: true }
];
const BUILT = 6;

const state = { role: 'committee', ward: 'W1', view: 'guide', filter: 'all', selected: null, table: 'reports', confirmReset: false };
try { const s = JSON.parse(sessionStorage.getItem('bwh-ui') || '{}'); Object.assign(state, s, { confirmReset: false }); } catch (e) {}
const persistUi = () => { try { sessionStorage.setItem('bwh-ui', JSON.stringify({ role: state.role, ward: state.ward, view: state.view, table: state.table })); } catch (e) {} };
const currentRole = () => ROLES.find(r => r.id === state.role) || ROLES[0];

/* ================= Top bar ================= */
const roleSel = document.getElementById('role-select');
const wardSel = document.getElementById('ward-select');
roleSel.innerHTML = ROLES.map(r => `<option value="${r.id}">${esc(r.label)}</option>`).join('');
wardSel.innerHTML = store.all('wards').map(w => `<option value="${w.id}">${esc(w.name)}</option>`).join('');
roleSel.value = state.role; wardSel.value = state.ward;
roleSel.addEventListener('change', () => { state.role = roleSel.value; render(); });
wardSel.addEventListener('change', () => { state.ward = wardSel.value; state.selected = null; render(); });

/* ================= Nav ================= */
function renderNav() {
  const groups = [['Demo', VIEWS.filter(v => v.stage <= BUILT && !v.admin)], ['Coming next', VIEWS.filter(v => v.stage > BUILT)], ['Setup', VIEWS.filter(v => v.admin)]].filter(g => g[1].length);
  document.getElementById('nav').innerHTML = groups.map(([label, items]) =>
    `<div class="rail-label">${label}</div>` + items.map(v => {
      const built = v.stage <= BUILT;
      return `<button class="nav-item" data-view="${v.id}" ${built ? '' : 'disabled'} ${state.view === v.id ? 'aria-current="page"' : ''}>
        <span>${esc(v.label)}</span>${built ? '' : `<span class="stage-chip">Stage ${v.stage}</span>`}</button>`;
    }).join('')
  ).join('');
}
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('.nav-item'); if (!b || b.disabled) return;
  state.view = b.dataset.view; render();
});

/* ================= Shared bits ================= */
function wardReports() { return store.where('reports', r => r.ward === state.ward && r.status !== 'merged'); }
function statusOf(r) { return isOverdue(r) ? 'overdue' : r.status; }
function statusPill(r) {
  const st = STATUS[r.status] || { label: 'Merged', color: 'var(--muted)' };
  const over = isOverdue(r) ? `<span class="pill" style="color:var(--st-overdue)"><span class="dot overdue"></span>Overdue</span>` : '';
  return `<span class="pill"><span class="dot" style="background:${st.color}"></span>${st.label}</span> ${over}`;
}
function statsBar(list) {
  const counts = { all: list.length, new: 0, assigned: 0, in_progress: 0, fixed: 0, overdue: 0 };
  list.forEach(r => { counts[r.status]++; if (isOverdue(r)) counts.overdue++; });
  const items = [['all', 'All open and fixed', null], ['new', 'New', STATUS.new.color], ['assigned', 'Assigned', STATUS.assigned.color], ['in_progress', 'In progress', STATUS.in_progress.color], ['fixed', 'Fixed', STATUS.fixed.color], ['overdue', 'Overdue', 'overdue']];
  return `<div class="stats" role="group" aria-label="Filter by status">` + items.map(([k, label, c]) =>
    `<button class="stat" data-filter="${k}" aria-pressed="${state.filter === k}">${c === 'overdue' ? '<span class="dot overdue"></span>' : c ? `<span class="dot" style="background:${c}"></span>` : ''}${label} <b>${counts[k]}</b></button>`
  ).join('') + `</div>`;
}
function passesFilter(r) {
  if (state.filter === 'all') return true;
  if (state.filter === 'overdue') return isOverdue(r);
  return r.status === state.filter;
}
function roleNote() {
  const role = currentRole();
  if (role.partner) return `Cases owned by ${esc(partnerShort(role.partner))} are highlighted; others are faded.`;
  if (role.id === 'resident') return 'Residents see every report and its status, but not who is assigned.';
  return 'The ward committee sees every report, owner and due time.';
}

function pinSvg(r) {
  const role = currentRole();
  const dim = role.partner && r.owner !== role.partner;
  const radius = r.size === 'large' ? 15 : r.size === 'medium' ? 12 : 9;
  const color = (STATUS[r.status] || STATUS.new).color;
  const dups = duplicatesOf(r).length;
  const over = isOverdue(r) ? `<circle r="${radius + 6}" fill="none" stroke="var(--st-overdue)" stroke-width="3"/>` : '';
  const badge = dups ? `<g transform="translate(${radius},${-radius})"><circle r="8" fill="var(--surface)" stroke="var(--fg)" stroke-width="1"/><text text-anchor="middle" y="4" font-size="10" font-weight="700" fill="var(--fg)">${dups + 1}</text></g>` : '';
  return `<g class="pin${dim ? ' dim' : ''}${state.selected === r.id ? ' selected' : ''}${r.live ? ' fresh' : ''}" transform="translate(${r.x},${r.y})" tabindex="0" role="button" data-id="${r.id}" aria-label="${esc(r.id + ', ' + CATEGORIES[r.category] + ', ' + (STATUS[r.status] || {}).label + ', ' + r.near)}">
    ${over}<circle class="core" r="${radius}" fill="${color}" stroke="var(--surface)" stroke-width="2"/>${badge}</g>`;
}

function summaryPanel(list) {
  const open = list.filter(r => r.status !== 'fixed');
  const fixed = list.filter(r => r.status === 'fixed');
  const fixHours = fixed.map(r => (r.fixed - r.created) / HOUR).sort((a, b) => a - b);
  const median = fixHours.length ? Math.round(fixHours[Math.floor(fixHours.length / 2)]) : null;
  const byOwner = {};
  open.forEach(r => { const k = r.owner ? partnerShort(r.owner) : 'Not yet assigned'; byOwner[k] = (byOwner[k] || 0) + 1; });
  return `<h3>This ward at a glance</h3>
    <dl class="kv">
      <dt>Open reports</dt><dd>${open.length}</dd>
      <dt>Overdue</dt><dd>${open.filter(isOverdue).length}</dd>
      <dt>Fixed</dt><dd>${fixed.length}</dd>
      <dt>Median fix time</dt><dd>${median == null ? '—' : median + ' hours'}</dd>

}

const viewEl = document.getElementById('view');

  roleSel.value = state.role; wardSel.value = state.ward;
  renderNav();
  ({ map: renderMap, reports: renderReports, chat: renderChat, queue: renderQueue, pickers: renderPickers, review: renderReview, guide: renderGuide, feedback: renderFeedback, tables: renderTables, settings: renderSettings }[state.view] || renderMap)(viewEl);
  afterRender();
  persistUi();

viewEl.addEventListener('click', e => {
  const t = e.target;
  const f = t.closest('[data-filter]'); if (f) { state.filter = f.dataset.filter; render(); return; }
  const pin = t.closest('.pin'); if (pin) { state.selected = pin.dataset.id; render(); return; }
  if (t.closest('[data-close]')) { state.selected = null; render(); return; }
  const row = t.closest('[data-open]'); if (row) { state.selected = row.dataset.open; state.view = 'map'; state.filter = 'all'; render(); return; }
  const tab = t.closest('[data-table]'); if (tab) { state.table = tab.dataset.table; render(); return; }
  if (t.closest('[data-become-admin]')) { state.role = 'admin'; render(); return; }
  if (t.closest('[data-reset]')) { state.confirmReset = true; render(); return; }
  if (t.closest('[data-reset-no]')) { state.confirmReset = false; render(); return; }
  if (t.closest('[data-reset-yes]')) { store.reset(); resetSims(); state.confirmReset = false; state.selected = null; render(); return; }
});
viewEl.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('.pin, [data-open]'); if (!el) return;
  e.preventDefault(); el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
});

const uploads = {}; // uploaded photos stay in memory for this visit only

/* ================= Stage 2: the report pipeline =================
   The same steps the real app will run on a server:
   receive -> AI triage -> duplicate check -> routing by the Charter. */
const feed = [];
function logFeed(kind, text, reportId) { feed.unshift({ time: Date.now(), kind, text, reportId: reportId || null }); }
function nextReportId() {
  const max = Math.max(0, ...store.all('reports').map(r => Number(r.id.slice(4)) || 0));
  return 'BWH-' + String(max + 1).padStart(5, '0');
}
function addEvent(report, actor, action, note, at) { store.insert('report_events', { report, time: at || Date.now(), actor, action, note: note || '' }); }
function submitReport(d) {
  const sp = SPOTS[d.ward][d.spot];
  const now = Date.now();
  const id = nextReportId();
  const jit = () => Math.round((Math.random() - 0.5) * 24);
  const fromSample = d.photo && d.photo !== 'upload';
  const r = {
    id, ward: d.ward, near: sp.near, x: sp.x + jit(), y: sp.y + jit(), channel: d.channel,
    category: d.category, size: d.size, hazards: d.hazards, created: now, status: 'new',
    merged_into: null, owner: null, due: null, fixed: null,
    ai_confidence: fromSample ? 86 + Math.floor(Math.random() * 11) : 70 + Math.floor(Math.random() * 10),
    photo: d.photo || null, live: true
  };
  store.insert('reports', r);
  if (d.photo === 'upload' && d.uploadData) uploads[id] = d.uploadData;
  const wardName = store.get('wards', d.ward).name;
  addEvent(id, 'Resident', 'Reported', 'via ' + d.channel, now);
  logFeed('new', `${id} received by ${d.channel} in ${wardName}.`, id);
  const tagNote = CATEGORIES[r.category] + ', ' + r.size + (r.hazards.length ? ', ' + r.hazards.map(h => HAZARDS[h].toLowerCase()).join(', ') : '');
  addEvent(id, 'AI triage', 'Tagged', tagNote, now + 1000);
  logFeed('new', `AI triage tagged it: ${tagNote} (${r.ai_confidence}% confident).`, id);

  const nearby = store.where('reports', x => x.ward === r.ward && x.id !== id && x.status !== 'merged' && x.status !== 'fixed')
    .map(x => ({ x, dist: Math.hypot(x.x - r.x, x.y - r.y) })).filter(o => o.dist < 70).sort((a, b) => a.dist - b.dist);
  if (nearby.length) {
    const prim = nearby[0].x;
    store.update('reports', id, { status: 'merged', merged_into: prim.id });
    const extra = r.hazards.filter(h => !prim.hazards.includes(h));
    if (extra.length) store.update('reports', prim.id, { hazards: prim.hazards.concat(extra) });
    addEvent(id, 'AI triage', 'Merged', 'Same site as ' + prim.id, now + 2000);
    logFeed('merge', `Same site as open report ${prim.id}, so it was merged there instead of creating a new case${extra.length ? '; the new hazard was added to that case' : ''}.`, prim.id);
    return { report: store.get('reports', id), mergedInto: prim };
  }
  const rule = matchRule(store.all('routing_rules'), r);
  store.update('reports', id, { status: 'assigned', owner: rule.partner, due: now + rule.hours * HOUR });
  addEvent(id, 'Routing', 'Assigned', 'To ' + partnerShort(rule.partner) + ', due within ' + rule.hours + ' h (rule ' + rule.id + ')', now + 3000);
  logFeed('route', `No open report at that spot, so a new case was opened and routed to ${partnerShort(rule.partner)}, due within ${rule.hours} hours (Charter rule ${rule.id}).`, id);
  return { report: store.get('reports', id), rule };
}

  if (!r) return null;
  const target = r.status === 'merged' ? store.get('reports', r.merged_into) : r;

    sms: 'Uchawana SMS kana zvagadziriswa.', cancelled: 'Zvakanzurwa.', bye: 'Ndatenda. Fambai zvakanaka.',

    registered: (id, m) => `Wanyoreswa se ${id}.\nVatengi ve ${m} vachakubata ne SMS.`, ended: '[Zvapera]'
  }
};
function ussdShow() {
  const u = ussd, w = store.get('wards', state.ward), L = UT[u.lang] || UT.en;
  const lines = {
    idle: `Dial ${USSD_CODE}\nthen press Send.\n\n(Fictional demo code. Works on any basic phone, no data needed.)`,
    lang: 'Bulawayo Waste Hub\n1 English\n2 isiNdebele\n3 chiShona',

    r_type: L.type + '\n' + Object.keys(CATEGORIES).map((c, i) => `${i + 1} ${short(catL(c, u.lang), 28)}`).join('\n'),
    r_size: L.size,
    r_hz: L.hz,
    r_confirm: () => `${L.confirm}\n${catL(u.draft.category, u.lang)}, ${({ nd: SIZE_ND, sn: SIZE_SN }[u.lang] || { small: 'small', medium: 'medium', large: 'large' })[u.draft.size].split(' (')[0]}\n${short(spotL(state.ward, u.draft.spot, u.lang), 34)}\n${L.sendCancel}`,
    check: L.check,
    p_mat: L.pmat(short(w.name, 20)),
    days: () => L.days + '\n' + (store.where('collection_schedule', c => c.ward === state.ward).map(c => `${dayL(c.day, u.lang)}: ${short(areaL(c.area, u.lang), 26)}`).join('\n') || L.none) + '\n\n' + L.back
  };
  const v = lines[u.screen];
  u.text = typeof v === 'function' ? v() : (v || u.text);
}
function ussdEnd(msg) { const L = UT[ussd.lang] || UT.en; ussd.screen = 'end'; ussd.text = msg + '\n\n' + L.ended; ussd.draft = {}; }
function ussdSend() {
  const u = ussd, inp = u.input.trim(); u.input = '';
  const n = Number(inp), L = UT[u.lang] || UT.en;
  switch (u.screen) {
    case 'idle': case 'end':
      if (inp.replace(/\s/g, '') === USSD_CODE) { u.screen = 'lang'; u.lang = 'en'; } else { u.screen = 'idle'; ussdShow(); u.text = `Unknown code. Dial ${USSD_CODE}`; return; }
      break;
    case 'lang': if (n >= 1 && n <= 3) { u.lang = ['en', 'nd', 'sn'][n - 1]; u.screen = 'menu'; } break;
    case 'menu':
      if (n === 1) { u.draft = { ward: state.ward, channel: 'USSD', hazards: [] }; u.screen = 'r_where'; }
      else if (n === 2) u.screen = 'check';
      else if (n === 3) u.screen = 'p_mat';
      else if (n === 4) u.screen = 'days';
      else if (inp === '0') return ussdEnd(L.bye);
      break;
    case 'r_where': if (n >= 1 && n <= SPOTS[state.ward].length) { u.draft.spot = n - 1; const hz = SPOTS[state.ward][n - 1].hz; if (hz) u.draft.hazards.push(hz); u.screen = 'r_type'; } break;
    case 'r_type': { const keys = Object.keys(CATEGORIES); if (n >= 1 && n <= keys.length) { u.draft.category = keys[n - 1]; u.screen = 'r_size'; } break; }
    case 'r_size': if (n >= 1 && n <= 3) { u.draft.size = ['small', 'medium', 'large'][n - 1]; u.screen = 'r_hz'; } break;
    case 'r_hz': if (n >= 1 && n <= 4) { const hz = [null, 'drain', 'burning', 'school', null][n]; if (hz && !u.draft.hazards.includes(hz)) u.draft.hazards.push(hz); u.screen = 'r_confirm'; } break;
    case 'r_confirm':
      if (n === 1) {
        const res = submitReport(u.draft);
        notifyTargets[res.report.id] = { channel: 'USSD', lang: u.lang };
        return ussdEnd(L.thanks(res.report.id) + '\n' + (res.mergedInto ? L.added(res.mergedInto.id) : L.sent(partnerShort(res.rule.partner))) + '\n' + L.sms);
      }
      if (n === 2) return ussdEnd(L.cancelled);
      break;
    case 'check': {
      const id = 'BWH-' + inp.replace(/\D/g, '').padStart(5, '0');
      const info = inp && statusText(store.get('reports', id));
      return ussdEnd(info ? `${id}: ${stL(info.target.status, u.lang)}${info.overdue ? ', ' + L.overdue : ''}${info.target.id !== id ? '\n' + L.merged(info.target.id) : ''}` : L.notFound);
    }
    case 'p_mat':
      if (n >= 1 && n <= 4) {
        const mat = ['PET plastic', 'cans', 'scrap metal', 'cardboard'][n - 1];
        const ids = store.all('pickers').map(p => Number(p.id.slice(3)) || 0);
        const id = 'PK-' + String(Math.max(0, ...ids) + 1).padStart(3, '0');
        store.insert('pickers', { id, ward: state.ward, phone: 'basic phone (USSD)', materials: mat, registered: Date.now() });
        pickerSms[id] = true;
        logFeed('picker', `New waste picker ${id} registered by USSD in ${store.get('wards', state.ward).name} (${mat}).`, null);
        return ussdEnd(L.registered(id, mat));
      }
      break;
    case 'days': if (inp === '0') u.screen = 'menu'; break;
  }
  ussdShow();
}

viewEl_stage2: {

    const sh = t.closest('[data-show]'); if (sh) { state.selected = sh.dataset.show; const r = store.get('reports', sh.dataset.show); if (r) state.ward = r.ward; state.view = 'map'; state.filter = 'all'; render(); window.scrollTo(0, 0); return; }
  });
  v.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'wa-form') { const i = document.getElementById('wa-text'); waText(i.value); render(); const n = document.getElementById('wa-text'); if (n) n.focus(); }

  });

    const f = e.target.files[0];
    const img = new Image(), reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        // Shrink the photo so the demo stays light
        const scale = Math.min(1, 480 / Math.max(img.width, img.height));

/* ================= Stage 3: partner queues and fixing ================= */
const notifyTargets = {};   // report id -> { channel, lang } for reports sent from the demo phones
const smsInbox = [];        // text messages received by the demo basic phone
Object.assign(T.en, { fixedNote: (id, who) => `Good news: report ${id} has been marked fixed by ${who}. Thank you for reporting.` });
Object.assign(T.nd, { fixedNote: (id, who) => `Izindaba ezinhle: umbiko ${id} usulungisiwe ngu ${who}. Siyabonga ngokubika.` });
Object.assign(T.sn, { fixedNote: (id, who) => `Mashoko akanaka: mushumo ${id} wagadziriswa na ${who}. Tatenda nekuzivisa.` });

function lastOf(id, actions) {
  return store.where('report_events', e => e.report === id && actions.includes(e.action)).sort((a, b) => b.time - a.time)[0];
}
function isVerified(r) { const l = lastOf(r.id, ['Fixed', 'Verified', 'Reopened']); return !!l && l.action === 'Verified'; }
function dueText(r) {
  if (r.status === 'fixed') return 'Fixed ' + ago(r.fixed);
  if (!r.due) return 'Not routed yet';
  const d = r.due - Date.now(), h = Math.abs(d) / HOUR;
  const t = h < 48 ? Math.max(1, Math.round(h)) + ' h' : Math.round(h / 24) + ' days';
  return d < 0 ? 'Overdue by ' + t : 'Due in ' + t;
}
function actorLabel() { const r = currentRole(); return r.partner ? partnerShort(r.partner) : r.label; }

function routeReport(id) {
  const r = store.get('reports', id); const rule = matchRule(store.all('routing_rules'), r); const now = Date.now();
  store.update('reports', id, { status: 'assigned', owner: rule.partner, due: now + rule.hours * HOUR });
  addEvent(id, 'Routing', 'Assigned', 'To ' + partnerShort(rule.partner) + ', due within ' + rule.hours + ' h (rule ' + rule.id + ')');
  logFeed('route', `${id} routed to ${partnerShort(rule.partner)} by Charter rule ${rule.id}.`, id);
  return rule;
}
function startWork(id) {
  store.update('reports', id, { status: 'in_progress' });
  addEvent(id, actorLabel(), 'Started', '');
  state.flash = `${id} is now in progress.`;
}
function reassign(id, partner) {
  const r = store.get('reports', id); const from = partnerShort(r.owner);
  store.update('reports', id, { owner: partner, status: 'assigned' });
  addEvent(id, actorLabel(), 'Reassigned', `From ${from} to ${partnerShort(partner)}`);
  logFeed('route', `${id} reassigned from ${from} to ${partnerShort(partner)}.`, id);
  state.flash = `${id} moved to ${partnerShort(partner)}'s queue.`;
}
function markFixed(id, photo, upload) {
  const r = store.get('reports', id); const now = Date.now(); const who = store.get('partners', r.owner).name;
  store.update('reports', id, { status: 'fixed', fixed: now, fixed_photo: photo || 'cleared' });
  if (photo === 'upload' && upload) uploads[id + ':after'] = upload;
  addEvent(id, partnerShort(r.owner), 'Fixed', 'After photo added', now);
  // Tell everyone who reported this site, including merged duplicates
  const ids = [id].concat(duplicatesOf(r).map(d => d.id));
  let wa_n = 0, sms_n = 0;
  ids.forEach(x => {
    const n = notifyTargets[x];
    if (n && n.channel === 'WhatsApp') { wa.msgs.push({ from: 'bot', text: T[n.lang || 'en'].fixedNote(x, who), time: now }); wa_n++; }
    else if (n && n.channel === 'USSD') { smsInbox.unshift({ time: now, text: (UT[n.lang] || UT.en).fixedSms(x) }); sms_n++; }
  });
  const others = ids.length - wa_n - sms_n;
  addEvent(id, 'System', 'Residents notified', `${ids.length} reporter${ids.length > 1 ? 's' : ''} told it is fixed (WhatsApp or SMS)`, now + 1000);
  logFeed('fixed', `${id} marked fixed by ${partnerShort(r.owner)}. ${ids.length} reporter${ids.length > 1 ? 's were' : ' was'} notified${wa_n || sms_n ? ` (${wa_n ? wa_n + ' on the demo WhatsApp' : ''}${wa_n && sms_n ? ', ' : ''}${sms_n ? sms_n + ' by SMS on the demo basic phone' : ''})` : ''}.`, id);
  state.flash = `${id} marked fixed. ${ids.length} reporter${ids.length > 1 ? 's' : ''} notified${wa_n || sms_n ? '; open WhatsApp and USSD to see the message' : ''}. The residents' association will verify the site.`;
}
function verifyFix(id, ok) {
  if (ok) {
    addEvent(id, actorLabel(), 'Verified', 'Site checked and cleared');
    state.flash = `${id} verified as cleared.`;
  } else {
    const r = store.get('reports', id);
    store.update('reports', id, { status: 'assigned', fixed: null, due: Date.now() + 24 * HOUR });
    addEvent(id, actorLabel(), 'Reopened', 'Waste still there; back to ' + partnerShort(r.owner) + ' within 24 h');
    logFeed('merge', `${id} reopened: residents found the waste still there. Back to ${partnerShort(r.owner)}, due within 24 hours.`, id);
    state.flash = `${id} reopened and sent back to ${partnerShort(r.owner)} with 24 hours to fix.`;
  }
}

const WORK_PARTNERS = ['P-BCC', 'P-EMA', 'P-OP', 'P-PG', 'P-WT'];
const sortCases = list => list.sort((a, b) => (isOverdue(b) - isOverdue(a)) || ((a.due || a.created) - (b.due || b.created)));
const q = { tab: null, fixing: null, fixPhoto: 'cleared', fixUpload: null, reassigning: null };

function caseCard(r, mode) {
  const late = isOverdue(r);
  const canAct = !['resident'].includes(state.role);
  let actions = '';
  if (q.fixing === r.id) {
    actions = `<div class="subform"><b>Add an after photo</b>
      <div class="after-choice">
        <button class="photo-btn" data-fixphoto="cleared" aria-pressed="${q.fixPhoto === 'cleared'}">${photoSvg('cleared')}<span>Site cleared</span></button>
        ${q.fixUpload ? `<button class="photo-btn" data-fixphoto="upload" aria-pressed="${q.fixPhoto === 'upload'}"><img src="${q.fixUpload}" alt="Your after photo" style="display:block;width:100%"><span>Your photo</span></button>` : ''}
        <label class="btn attach">Use my own photo<input type="file" accept="image/*" id="fix-file"></label>
      </div>
      <div class="actions"><button class="btn btn-primary" data-q="confirmfix:${r.id}">Confirm fixed</button><button class="btn" data-q="cancel:">Cancel</button></div></div>`;
  } else if (q.reassigning === r.id) {
    actions = `<div class="subform"><label for="reassign-to"><b>Move this case to</b></label>
      <select id="reassign-to">${WORK_PARTNERS.filter(p => p !== r.owner).map(p => `<option value="${p}">${esc(store.get('partners', p).name)}</option>`).join('')}</select>
      <div class="actions"><button class="btn btn-primary" data-q="doreassign:${r.id}">Move case</button><button class="btn" data-q="cancel:">Cancel</button></div></div>`;
  } else if (canAct) {
    const b = [];
    if (mode === 'unrouted') b.push(`<button class="btn btn-primary" data-q="route:${r.id}">Route by the Charter</button>`);
    if (mode === 'work' && r.status === 'assigned') b.push(`<button class="btn" data-q="start:${r.id}">Start work</button>`);
    if (mode === 'work') b.push(`<button class="btn btn-primary" data-q="fix:${r.id}">Mark fixed</button>`, `<button class="btn" data-q="reassign:${r.id}">Reassign</button>`);
    if (mode === 'verify') b.push(`<button class="btn btn-primary" data-q="verify:${r.id}">Confirm cleared</button>`, `<button class="btn" data-q="reopen:${r.id}">Still there</button>`);
    b.push(`<button class="linkish" data-show="${r.id}">Show on map</button>`);
    actions = `<div class="actions">${b.join('')}</div>`;
  }
  const dups = duplicatesOf(r).length;
  return `<article class="case st-${r.status}${late ? ' is-overdue' : ''}">
    <div class="case-photo">${mode === 'verify' ? afterMarkup(r) : photoMarkup(r)}</div>
    <div class="case-main">
      <div class="case-top"><b>${esc(CATEGORIES[r.category])}, ${esc(r.size)}</b><span class="ref">${r.id}${dups ? ` · ${dups + 1} reports` : ''}</span></div>
      <div>${esc(r.near)}</div>
      ${r.hazards.length ? `<div class="tags">${r.hazards.map(h => `<span class="tag" style="border-color:var(--st-overdue)">${esc(HAZARDS[h])}</span>`).join('')}</div>` : ''}
      <div class="due${late ? ' late' : ''}">${dueText(r)}${mode === 'verify' ? ' by ' + esc(partnerShort(r.owner)) : ''}</div>
      ${actions}
    </div></article>`;
}
function afterMarkup(r) {
  if (r.fixed_photo === 'upload' && uploads[r.id + ':after']) return `<img src="${uploads[r.id + ':after']}" alt="After photo">`;
  return photoSvg('cleared');
}

function renderQueue(el) {
  const role = currentRole(), ward = store.get('wards', state.ward);
  const reps = store.where('reports', r => r.ward === state.ward && r.status !== 'merged');
  const open = p => reps.filter(r => r.owner === p && (r.status === 'assigned' || r.status === 'in_progress'));
  const unrouted = reps.filter(r => r.status === 'new');
  const toVerify = reps.filter(r => r.status === 'fixed' && !isVerified(r));
  const flash = state.flash ? `<div class="flash" role="status">${esc(state.flash)}</div>` : '';
  state.flash = null;
  const head = (title, sub) => `<div class="view-head"><div><h2>${title}</h2><p>${sub}</p></div></div>${flash}`;
  const list = (items, mode, empty) => items.length ? `<div class="queue">${sortCases(items).map(r => caseCard(r, mode)).join('')}</div>` : `<p class="empty">${empty}</p>`;

  if (role.id === 'resident') { el.innerHTML = head('Partner queues', 'Residents don’t have a queue. Switch “Viewing as” to City Council, EMA or the ward committee to work cases.'); return; }
  if (role.id === 'association') {
    el.innerHTML = head(`Verify fixes in ${esc(ward.name)}`, 'The residents’ association checks each fixed site. Confirm it is clear, or reopen it if the waste is still there.') + list(toVerify, 'verify', 'No fixed cases are waiting for a check.');
    return;
  }
  if (role.partner && !WORK_PARTNERS.includes(role.partner)) {
    const msg = { 'P-CH': 'Churches don’t clear sites. Their tasks, such as hosting a drop-off point, come from the ward review in Stage 5.', 'P-BIZ': 'Business buyers confirm purchases from waste pickers. That comes in Stage 4.' }[role.partner] || 'No cases for this partner.';
    el.innerHTML = head(`${esc(partnerShort(role.partner))} queue`, msg); return;
  }
  if (role.partner) {
    const mine = open(role.partner);
    const recent = reps.filter(r => r.owner === role.partner && r.status === 'fixed').sort((a, b) => b.fixed - a.fixed).slice(0, 5);
    el.innerHTML = head(`${esc(store.get('partners', role.partner).name)}: ${mine.length} open case${mine.length === 1 ? '' : 's'}`, `Cases routed to you in ${esc(ward.name)}, overdue first. Start work, mark fixed with an after photo, or move a case to another partner.`)
      + list(mine, 'work', 'Nothing open. Well done.')
      + (recent.length ? `<details class="recent" style="margin-top:14px"><summary>Recently fixed (${recent.length})</summary><div class="queue" style="margin-top:8px">${recent.map(r => caseCard(r, 'done')).join('')}</div></details>` : '');
    return;
  }
  // Ward committee and administrator see every queue
  const tabs = [['unrouted', 'Not yet routed', unrouted.length]].concat(WORK_PARTNERS.map(p => [p, partnerShort(p), open(p).length]), [['verify', 'Awaiting verification', toVerify.length]]);
  if (!q.tab || !tabs.some(t => t[0] === q.tab)) q.tab = unrouted.length ? 'unrouted' : 'P-BCC';
  const body = q.tab === 'unrouted' ? list(unrouted, 'unrouted', 'Every report has been routed.')
    : q.tab === 'verify' ? list(toVerify, 'verify', 'No fixed cases are waiting for a check.')
    : list(open(q.tab), 'work', `${esc(partnerShort(q.tab))} has no open cases.`);

/* ================= Stage 5: ward review pack and forum overview ================= */
const rv = { tab: 'pack', text: '', owner: 'P-BCC', days: '14' };
const isCleanupDay = t => { const d = new Date(t); return d.getDay() === 5 && d.getDate() <= 7; };
function nextCleanupDay() { const t = firstFriday(Date.now(), 0); return t + 12 * HOUR > Date.now() ? t : firstFriday(Date.now(), 1); }
const median = arr => { if (!arr.length) return null; const s = arr.slice().sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; };

function wardStats(wardId, days) {
  const since = Date.now() - (days || 30) * DAY;
  const all = store.where('reports', r => r.ward === wardId);
  const recent = all.filter(r => r.created >= since);
  const cases = all.filter(r => r.status !== 'merged');
  const fixedRecent = cases.filter(r => r.status === 'fixed' && r.fixed >= since);
  const fixHours = fixedRecent.map(r => (r.fixed - r.created) / HOUR);
  const overdue = cases.filter(isOverdue);
  const between = recent.filter(r => !isCleanupDay(r.created)).length;
  const sites = {};
  recent.forEach(r => { sites[r.near] = (sites[r.near] || 0) + 1; });
  const hotspots = Object.entries(sites).sort((a, b) => b[1] - a[1]);
  const channels = {}; recent.forEach(r => { channels[r.channel] = (channels[r.channel] || 0) + 1; });
  const partners = WORK_PARTNERS.map(p => {
    const mine = cases.filter(r => r.owner === p);
    const fixed = mine.filter(r => r.status === 'fixed' && r.fixed >= since);
    const onTime = fixed.filter(r => r.due && r.fixed <= r.due).length;
    return { p, assigned: mine.filter(r => r.created >= since).length, open: mine.filter(r => r.status === 'assigned' || r.status === 'in_progress').length, fixed: fixed.length, median: median(fixed.map(r => (r.fixed - r.created) / HOUR)), overdue: mine.filter(isOverdue).length, onTime: fixed.length ? Math.round(onTime / fixed.length * 100) : null };
  });
  const pickerIds = new Set(store.where('pickers', p => p.ward === wardId).map(p => p.id));
  const kg = store.all('recoveries').filter(r => pickerIds.has(r.picker) && (r.status || 'confirmed') === 'confirmed' && r.date >= since).reduce((s, r) => s + r.kg, 0);
  const acts = wardActions(wardId);
  return { recent, cases, fixedRecent, medianFix: median(fixHours), overdue, betweenPct: recent.length ? Math.round(between / recent.length * 100) : null, hotspots, channels, partners, pickers: pickerIds.size, kg, acts, open: cases.filter(r => r.status !== 'fixed').length };
}
function wardActions(wardId) {
  const mids = new Set(store.where('meetings', m => m.ward === wardId).map(m => m.id));
  return store.all('actions').map((a, i) => { if (!a.id) a.id = 'A-' + String(i + 1).padStart(3, '0'); return a; }).filter(a => mids.has(a.meeting));
}
function actionStatus(a) { if (a.status === 'Done') return 'Done'; if (a.due < Date.now()) return 'Overdue'; return a.status === 'Overdue' ? 'In progress' : a.status; }
const ACLASS = { Done: 'done', Overdue: 'late', 'In progress': 'prog', 'Not started': 'todo' };

function aiSummary(w, s) {
  const parts = [];
  const ch = Object.entries(s.channels).sort((a, b) => b[1] - a[1]).map(([c, n]) => `${n} by ${c}`).join(', ');
  parts.push(`In the last 30 days ${w.name} received ${s.recent.length} report${s.recent.length === 1 ? '' : 's'}${ch ? ` (${ch})` : ''}${s.betweenPct != null ? `, ${s.betweenPct}% of them on days other than the monthly clean-up` : ''}.`);
  parts.push(`${s.fixedRecent.length} case${s.fixedRecent.length === 1 ? ' was' : 's were'} fixed${s.medianFix != null ? `, with a median of ${Math.round(s.medianFix)} hours from report to fix` : ''}; ${s.open} remain open and ${s.overdue.length} ${s.overdue.length === 1 ? 'is' : 'are'} overdue${s.overdue.length ? ` (${[...new Set(s.overdue.map(r => partnerShort(r.owner)))].join(', ')})` : ''}.`);
  if (s.hotspots.length && s.hotspots[0][1] > 1) parts.push(`The busiest site was ${s.hotspots[0][0].toLowerCase()}, with ${s.hotspots[0][1]} reports; the committee may want a standing measure there rather than repeated clear-ups.`);
  if (s.kg) parts.push(`Registered pickers recovered ${s.kg} kg of recyclables that would otherwise have gone to the dump or the landfill.`);
  const late = s.acts.filter(a => actionStatus(a) === 'Overdue');
  const done = s.acts.filter(a => actionStatus(a) === 'Done');
  if (s.acts.length) parts.push(`Of ${s.acts.length} actions agreed at reviews, ${done.length ? done.length + (done.length === 1 ? ' is' : ' are') + ' done' : 'none is done yet'}${late.length ? ` and ${late.length} ${late.length === 1 ? 'is' : 'are'} overdue: ${late.map(a => a.text.toLowerCase() + ' (' + partnerShort(a.owner) + ')').join('; ')}` : ''}.`);
  return parts.join(' ');
}
