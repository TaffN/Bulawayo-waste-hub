          <p class="hint" style="margin:0">Reports in the last 30 days by site, merged duplicates included. A site that keeps coming back needs a standing fix, not another clear-up.</p></section>
        <section class="panel"><h3>Last review</h3>
          ${last ? `<dl class="kv"><dt>Held</dt><dd>${fmtDay(last.date)}</dd><dt>Attended</dt><dd>${last.attended.map(partnerShort).map(esc).join(', ')}</dd><dt>Actions agreed</dt><dd>${s.acts.filter(a => a.meeting === last.id).length}</dd></dl>` : '<p class="empty">No review recorded yet.</p>'}
          ${canEdit ? `<div><button class="btn" data-rv="meeting">Record today's review</button></div><p class="hint" style="margin:0">Records a review today with the ward committee's partners; new actions are then attached to it.</p>` : ''}</section>
      </div>
      <section class="panel"><h3>Action tracker</h3>
        <div class="table-wrap"><table><thead><tr><th>Action</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead><tbody>
        ${s.acts.slice().sort((a, b) => a.due - b.due).map(a => { const st = actionStatus(a); return `<tr><td style="white-space:normal;min-width:200px">${esc(a.text)}</td><td>${esc(partnerShort(a.owner))}</td><td>${fmtDay(a.due)}</td><td>${canEdit ? `<select data-astatus="${a.id}" aria-label="Status of ${esc(a.text)}">${['Not started', 'In progress', 'Done'].map(o => `<option ${(st === o || (st === 'Overdue' && o === (a.status === 'Not started' ? 'Not started' : 'In progress'))) ? 'selected' : ''}>${o}</option>`).join('')}</select> ` : ''}<span class="astat ${ACLASS[st]}">${st === 'Overdue' ? 'Overdue' : canEdit ? '' : st}</span></td></tr>`; }).join('') || '<tr><td colspan="4" class="empty">No actions yet.</td></tr>'}
        </tbody></table></div>
        ${canEdit ? `<div class="add-action">
          <label for="act-text">New action<input id="act-text" value="${esc(rv.text)}" placeholder="e.g. Put two skip bins at the bus stop"></label>
          <label for="act-owner">Owner<select id="act-owner">${store.all('partners').map(p => `<option value="${p.id}" ${rv.owner === p.id ? 'selected' : ''}>${esc(p.short)}</option>`).join('')}</select></label>
          <label for="act-days">Due in<select id="act-days">${[['7', '1 week'], ['14', '2 weeks'], ['30', '1 month']].map(([v, l]) => `<option value="${v}" ${rv.days === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
          <button class="btn btn-primary" data-rv="addaction">Add action</button></div>` : '<p class="empty" style="margin:0">Switch to Ward committee to add or update actions.</p>'}
      </section>
    </div>`;
}

function renderForum(tabs, flash) {
  const wards = store.all('wards');
  const stats = wards.map(w => [w, wardStats(w.id, 30)]);
  const allPickers = store.all('pickers').length;
  const allReps = store.all('reports');
  const fixedAll = allReps.filter(r => r.status === 'fixed' && r.fixed >= Date.now() - 30 * DAY);
  const op1 = median(fixedAll.map(r => (r.fixed - r.created) / HOUR));
  const recentAll = allReps.filter(r => r.created >= Date.now() - 30 * DAY);
  const op2 = recentAll.length ? Math.round(recentAll.filter(r => !isCleanupDay(r.created)).length / recentAll.length * 100) : null;
  const current = { OP1: op1 == null ? null : Math.round(op1) + ' h', OP2: op2 == null ? null : op2 + '%' };
  return `<div class="view-head"><div><h2>City Waste Partnership Forum</h2><p>Every ward side by side, and the framework's indicators. Survey results fill the baselines; the forum sets the targets.</p></div></div>
    ${tabs}${flash}
    <div class="section-gap">
      <section class="panel"><h3>Wards in the last 30 days</h3>
        <div class="table-wrap"><table><thead><tr><th>Ward</th><th>Reports</th><th>Between clean-ups</th><th>Median fix</th><th>Open</th><th>Overdue</th><th>Pickers</th><th>Recovered</th><th>Actions overdue</th></tr></thead><tbody>
        ${stats.map(([w, s]) => `<tr><td>${esc(w.name)}</td><td class="num">${s.recent.length}</td><td class="num">${s.betweenPct == null ? '—' : s.betweenPct + '%'}</td><td class="num">${s.medianFix == null ? '—' : Math.round(s.medianFix) + ' h'}</td><td class="num">${s.open}</td><td class="num" style="${s.overdue.length ? 'color:var(--st-overdue);font-weight:600' : ''}">${s.overdue.length}</td><td class="num">${s.pickers}</td><td class="num">${s.kg} kg</td><td class="num">${s.acts.filter(a => actionStatus(a) === 'Overdue').length}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="hint" style="margin:0">More wards join this table as the framework is rolled out.</p></section>
      <section class="panel"><h3>Framework indicators</h3>
        <div class="table-wrap"><table><thead><tr><th>Code</th><th>Indicator</th><th>Source</th><th>Baseline</th><th>Now</th><th>Target</th></tr></thead><tbody>
        ${store.all('indicators').map(i => `<tr><td class="mono">${i.code}</td><td style="white-space:normal;min-width:220px">${esc(i.name)}</td><td>${i.section === 'App' ? 'App data' : 'Questionnaire ' + i.section}</td>
          <td>${i.baseline != null ? esc(i.baseline) : i.section === 'App' ? '<span class="empty">Set at pilot start</span>' : '<span class="pill pending">Awaiting survey</span>'}</td>
          <td>${current[i.code] ? esc(current[i.code]) : i.code === 'C2' ? allPickers + ' registered' : '<span class="empty">Repeat survey</span>'}</td>
          <td>${i.target != null ? esc(i.target) : '<span class="empty">Forum to set</span>'}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="hint" style="margin:0">Questionnaire indicators (Sections B–E) get their baseline from the survey and are re-measured by a short repeat survey. App indicators update daily.</p></section>
    </div>`;
}

{
  const v = document.getElementById('view');
  v.addEventListener('click', e => {
    const t = e.target.closest('[data-rvtab]'); if (t) { rv.tab = t.dataset.rvtab; render(); return; }
    const a = e.target.closest('[data-rv]'); if (!a) return;
    if (a.dataset.rv === 'meeting') {
      const w = store.get('wards', state.ward);
      const id = 'M-' + state.ward + '-' + Date.now().toString(36);
      store.insert('meetings', { id, ward: state.ward, date: Date.now(), title: 'Ward review after clean-up day', attended: w.committee.slice() });
      state.flash = `Review recorded for today with ${w.committee.map(partnerShort).join(', ')}. New actions will be attached to it.`;
    }
    if (a.dataset.rv === 'addaction') {
      const text = rv.text.trim();
      if (!text) { state.flash = 'Type the action first, for example "Put two skip bins at the bus stop".'; }
      else {
        let m = store.where('meetings', x => x.ward === state.ward).sort((x, y) => y.date - x.date)[0];
        if (!m) { m = store.insert('meetings', { id: 'M-' + state.ward + '-' + Date.now().toString(36), ward: state.ward, date: Date.now(), title: 'Ward review', attended: store.get('wards', state.ward).committee.slice() }); }
        const id = 'A-' + String(store.all('actions').length + 1).padStart(3, '0') + '-' + Date.now().toString(36).slice(-3);
        store.insert('actions', { id, meeting: m.id, text, owner: rv.owner, due: Date.now() + Number(rv.days) * DAY, status: 'Not started' });
        state.flash = `Action added for ${partnerShort(rv.owner)}, due ${fmtDay(Date.now() + Number(rv.days) * DAY)}.`;
        rv.text = '';
      }
    }
    render();
  });
  v.addEventListener('input', e => { if (e.target.id === 'act-text') rv.text = e.target.value; });
  v.addEventListener('change', e => {
    if (e.target.id === 'act-owner') rv.owner = e.target.value;
    if (e.target.id === 'act-days') rv.days = e.target.value;
    if (e.target.dataset && e.target.dataset.astatus) {
      const id = e.target.dataset.astatus;
      store.update('actions', id, { status: e.target.value });
      state.flash = `Action marked ${e.target.value.toLowerCase()}.`;
      render();
    }
  });
}


/* ================= Stage 6: demo guide and stakeholder feedback ================= */
const GUIDE = [
  { t: 'See the ward at a glance', d: 'Open the Cowdray Park map. Point out the pins, the overdue red rings and the merged reports at the market.', why: 'Shared information system: every partner sees the same picture.', go: { role: 'committee', view: 'map', ward: 'W1' } },
  { t: 'A resident reports on WhatsApp', d: 'As a resident, report bags of rubbish at the market stalls. The report is merged with the existing case instead of duplicating it.', why: 'Reporting on any day, not only clean-up Friday (research question 2).', go: { role: 'resident', view: 'chat', ward: 'W1' } },
  { t: 'A basic phone, in isiNdebele', d: 'On the basic phone, dial the code, choose isiNdebele, and report somewhere new. Watch the system route it to a partner.', why: 'Inclusive tools: no smartphone or data needed, local languages.', go: { role: 'resident', view: 'chat', ward: 'W1' } },
  { t: 'The Council fixes it', d: 'As City Council, open the queue: start work, mark fixed with an after photo. Then show the "fixed" message on both phones.', why: 'Clear roles and response times from the Partnership Charter (research question 3).', go: { role: 'bcc', view: 'queue', ward: 'W1' } },
  { t: 'Residents check the site', d: 'As the residents’ association, confirm a fix or tap "Still there" to send it back with 24 hours.', why: 'Shared accountability and legitimacy: residents verify, not only officials.', go: { role: 'association', view: 'queue', ward: 'W1' } },
  { t: 'Pickers are paid for recovery', d: 'As a waste picker, log 30 kg of PET plastic. As the business buyer, confirm it and pay by (simulated) mobile money.', why: 'Formal inclusion of waste pickers and business (hypothesis 3).', go: { role: 'picker', view: 'pickers', ward: 'W1' } },
  { t: 'The monthly ward review', d: 'Open the review pack: the AI summary, how each partner did, repeat sites, and the action tracker. Add an action for the church.', why: 'Turns the monthly clean-up into a monthly cycle of review and action (hypothesis 2).', go: { role: 'committee', view: 'review', ward: 'W1' } },
  { t: 'The city forum and the survey', d: 'Switch to Forum overview: wards side by side and the indicators waiting for the survey baseline.', why: 'Questionnaire Sections B–E become the framework’s indicators.', go: { role: 'committee', view: 'review', ward: 'W1', tab: 'forum' } },
  { t: 'Ask for feedback', d: 'Hand the device round and ask each stakeholder to fill in the short feedback form.', why: 'Stakeholder buy-in is part of making the framework acceptable.', go: { role: 'committee', view: 'feedback', ward: 'W1' } }
];
function renderGuide(el) {
  el.innerHTML = `<div class="hero-intro">
      <h2>A shared system for a cleaner Bulawayo</h2>
      <p>Residents report dumped waste by WhatsApp or a basic phone. Each report goes to the partner responsible, is fixed, checked by residents, and reviewed every month by the ward committee and the city forum. This demo uses invented data only.</p>
    </div>
    <div class="view-head"><div><h2>Demo guide</h2><p>A ten-minute walkthrough for stakeholder meetings. Each “Go” button opens the right screen with the right role. Reset the demo data in Settings before each meeting.</p></div></div>
    <ol class="steps">${GUIDE.map((g, i) => `<li class="step"><div><h3>${esc(g.t)}</h3><p>${esc(g.d)}</p><p class="why">Why it matters: ${esc(g.why)}</p><span class="as">Viewing as: ${esc(ROLES.find(r => r.id === g.go.role).label)}</span></div><button class="btn btn-primary" data-guide="${i}">Go</button></li>`).join('')}</ol>`;
}

const FB_KEY = 'bwh-feedback-v1';
const FB_TYPES = ['City Council (BCC)', 'EMA', 'Church or faith group', "Residents' association", 'Business or recycler', 'Waste picker', 'Resident', 'NGO or university', 'Other'];
const FB_Q = [
  ['clear', 'The app is easy to understand'],
  ['coord', 'It would help partners coordinate in my ward'],
  ['fair', 'It treats waste pickers and residents fairly'],
  ['use', 'My organisation would use it']
];
let fbList = [];
try { fbList = JSON.parse(localStorage.getItem(FB_KEY) || '[]') || []; } catch (e) { fbList = []; }
const fbSave = () => { try { localStorage.setItem(FB_KEY, JSON.stringify(fbList)); } catch (e) {} };
const fb = { type: FB_TYPES[0], org: '', r: {}, missing: '', worry: '', last: null, showAll: false };
function fbText(f) {
  return `Bulawayo Waste Hub demo feedback\nFrom: ${f.type}${f.org ? ', ' + f.org : ''}\n` + FB_Q.map(([k, q]) => `${q}: ${f.r[k] || '-'}/5`).join('\n') + `\nWhat is missing: ${f.missing || '-'}\nConcerns: ${f.worry || '-'}`;
}
function fbCsv() {
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  return ['date,stakeholder,organisation,' + FB_Q.map(x => x[0]).join(',') + ',missing,concerns']
    .concat(fbList.map(f => [new Date(f.time).toISOString().slice(0, 10), q(f.type), q(f.org)].concat(FB_Q.map(([k]) => f.r[k] || ''), [q(f.missing), q(f.worry)]).join(','))).join('\n');
}
function renderFeedback(el) {
  const flash = state.flash ? `<div class="flash" role="status">${esc(state.flash)}</div>` : ''; state.flash = null;
  const avg = k => { const v = fbList.map(f => f.r[k]).filter(Boolean); return v.length ? (v.reduce((a, b) => a + b, 0) / v.length).toFixed(1) : '—'; };
  el.innerHTML = `<div class="view-head"><div><h2>Stakeholder feedback</h2><p>Takes two minutes. Pass the device round at a meeting: each answer is kept on this device until Karl copies them out.</p></div></div>
    ${flash}
    <div class="two-col">
      <section class="panel"><h3>Your feedback</h3>
        <form id="fb-form" class="section-gap" style="gap:0">
          <div class="fq"><label for="fb-type"><b>I am from</b></label><select id="fb-type" class="btn" style="text-align:left">${FB_TYPES.map(t => `<option ${fb.type === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
            <label for="fb-org"><small>Organisation or ward (optional)</small></label><input id="fb-org" class="btn" style="text-align:left;cursor:text" value="${esc(fb.org)}" autocomplete="off"></div>
          ${FB_Q.map(([k, q]) => `<div class="fq" role="radiogroup" aria-label="${esc(q)}"><b>${esc(q)}</b><small>1 = strongly disagree, 5 = strongly agree</small>
            <div class="rating">${[1, 2, 3, 4, 5].map(n => `<label><input type="radio" name="fb-${k}" value="${n}" ${fb.r[k] === n ? 'checked' : ''}><span>${n}</span></label>`).join('')}</div></div>`).join('')}
          <div class="fq"><label for="fb-missing"><b>What is missing?</b></label><textarea id="fb-missing" class="fb">${esc(fb.missing)}</textarea></div>
          <div class="fq"><label for="fb-worry"><b>What worries you about it?</b></label><textarea id="fb-worry" class="fb">${esc(fb.worry)}</textarea></div>
          <div class="fq" style="border:0"><button class="btn btn-primary" type="submit">Save my feedback</button></div>
        </form></section>
      <div class="section-gap">
        ${fb.last ? `<section class="panel"><h3>Thank you</h3><p class="empty" style="margin:0">Your answers are saved on this device. To send them yourself, copy them or share on WhatsApp.</p>
          <textarea class="copybox" id="fb-one" readonly>${esc(fbText(fb.last))}</textarea>
          <div class="actions"><button class="btn" data-fb="copyone">Copy</button><a class="btn" href="https://wa.me/?text=${encodeURIComponent(fbText(fb.last))}" target="_blank" rel="noopener">Share on WhatsApp</a></div></section>` : ''}
        <section class="panel"><h3>Collected on this device (${fbList.length})</h3>
          ${fbList.length ? `<dl class="kv">${FB_Q.map(([k, q]) => `<dt>${esc(q)}</dt><dd>${avg(k)} / 5</dd>`).join('')}</dl>
            <div class="table-wrap"><table><thead><tr><th>Stakeholder</th><th>Scores</th><th>Missing</th></tr></thead><tbody>${fbList.slice().reverse().map(f => `<tr><td>${esc(f.type)}</td><td class="mono">${FB_Q.map(([k]) => f.r[k] || '-').join(' ')}</td><td style="white-space:normal;min-width:160px">${esc(f.missing || '—')}</td></tr>`).join('')}</tbody></table></div>
            <p class="hint" style="margin:0">For Karl: copy all answers as a spreadsheet (CSV) and paste them into Excel or Google Sheets.</p>
            ${fb.showAll ? `<textarea class="copybox" id="fb-all" readonly>${esc(fbCsv())}</textarea>` : ''}
            <div class="actions"><button class="btn" data-fb="copyall">Copy all as spreadsheet</button>${fb.confirmClear ? `<span>Delete all ${fbList.length} answers on this device?</span><button class="btn btn-primary" data-fb="clearyes">Delete</button><button class="btn" data-fb="clearno">Cancel</button>` : `<button class="btn" data-fb="clear">Clear answers</button>`}</div>`
          : '<p class="empty" style="margin:0">No answers yet. Feedback is kept separately from the demo data, so resetting the demo does not delete it.</p>'}
        </section>
      </div>
    </div>`;
}
function copyText(text, boxId) {
  const done = () => { state.flash = 'Copied. Paste it wherever you need it.'; render(); };
  const fallback = () => { fb.showAll = true; render(); const b = document.getElementById(boxId); if (b) { b.focus(); b.select(); } state.flash = null; };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}

{
  const v = document.getElementById('view');
  v.addEventListener('click', e => {
    const g = e.target.closest('[data-guide]');
    if (g) {
      const s = GUIDE[Number(g.dataset.guide)].go;
      state.role = s.role; state.ward = s.ward; state.view = s.view; state.filter = 'all'; state.selected = null;
      if (s.view === 'review') rv.tab = s.tab || 'pack';
      render(); window.scrollTo(0, 0); return;
    }
    const a = e.target.closest('[data-fb]'); if (!a) return;
    const cmd = a.dataset.fb;
    if (cmd === 'copyone') return copyText(fbText(fb.last), 'fb-one');
    if (cmd === 'copyall') { fb.showAll = true; return copyText(fbCsv(), 'fb-all'); }
    if (cmd === 'clear') fb.confirmClear = true;
    if (cmd === 'clearno') fb.confirmClear = false;
    if (cmd === 'clearyes') { fbList = []; fbSave(); fb.confirmClear = false; fb.last = null; state.flash = 'All feedback on this device was deleted.'; }
    render();
  });
  v.addEventListener('input', e => {
    const id = e.target.id;
    if (id === 'fb-org') fb.org = e.target.value; if (id === 'fb-missing') fb.missing = e.target.value; if (id === 'fb-worry') fb.worry = e.target.value;
  });
  v.addEventListener('change', e => {
    if (e.target.id === 'fb-type') fb.type = e.target.value;
    const m = /^fb-(\w+)$/.exec(e.target.name || ''); if (m) fb.r[m[1]] = Number(e.target.value);
  });
  v.addEventListener('submit', e => {
    if (e.target.id !== 'fb-form') return;
    e.preventDefault();
    if (!FB_Q.some(([k]) => fb.r[k])) { state.flash = 'Please choose a score for at least one statement before saving.'; render(); return; }
    const entry = { time: Date.now(), type: fb.type, org: fb.org.trim(), r: Object.assign({}, fb.r), missing: fb.missing.trim(), worry: fb.worry.trim() };
    fbList.push(entry); fbSave();
    fb.last = entry; fb.org = ''; fb.r = {}; fb.missing = ''; fb.worry = '';
    state.flash = 'Saved. Thank you. Pass the device to the next person.';
    render(); window.scrollTo(0, 0);
  });
}


render();
})();
</script>
</body>
</html>
